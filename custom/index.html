<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>포트폴리오</title>
<link rel="icon" href="data:," />
<!-- 직접 생성 모드(/portfolio-custom) — 키보드 ← → 로 넘기는 슬라이드형 포트폴리오.
     내용은 ../data/*.json에서만 읽습니다. /portfolio-build를 다시 하면 이 페이지도 최신이 됩니다.
     색·모양·영문 글꼴은 ../theme/theme.css의 손잡이(--t-*)를 따릅니다. UI 문구는 ../theme/strings.tsv(문구 표)를 따릅니다. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/montserrat@5.2.8/latin-700.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/montserrat@5.2.8/latin-800.css" />
<link rel="stylesheet" href="../theme/theme.css" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
<script src="../assets/strings.js"></script>
<style>
  :root {
    --bg: var(--t-bg, #111111);
    --card: var(--t-surface, #181A26);
    --ink: var(--t-ink, #FFFFFF);
    --body: var(--t-body, #EBEBEB);
    --muted: var(--t-muted, #A6A8B4);
    --line: var(--t-line, #262B44);
    --line2: var(--t-line-2, #3E4566);
    --accent: var(--t-accent, #EC1C23);
    --r: var(--t-radius, 6px);
    --pill: var(--t-pill, 4px);
    --en: var(--t-display, 'Montserrat'), 'Montserrat', 'Pretendard', sans-serif;
  }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--body); overflow: hidden; overflow: clip; }
  main { overflow: clip; }   /* 포커스·스크롤 이동이 가로 레일을 밀지 못하게(장 이동은 transform만) */
  body { font-family: 'Pretendard', system-ui, sans-serif; -webkit-font-smoothing: antialiased; word-break: keep-all; }
  #root { height: 100%; }

  /* 슬라이드 레일 — 가로로 한 줄, transform으로 이동 (마우스 휠로 넘어가지 않음) */
  .rail { display: flex; height: 100%; transition: transform .55s cubic-bezier(.7,0,.2,1); will-change: transform; }
  .slide { flex: 0 0 100vw; width: 100vw; height: 100%; position: relative; overflow: hidden; }
  .slide-inner { height: 100%; overflow-y: auto; overscroll-behavior: contain; padding: 108px 7vw 80px; box-sizing: border-box; }
  .slide-inner > .wrap { max-width: 1240px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; justify-content: center; }
  @media (max-width: 759px) { .slide-inner { padding: 70px 16px 92px; } }

  .eyebrow { font-family: var(--en); font-weight: 800; letter-spacing: .18em; font-size: 12px; color: var(--accent); text-transform: uppercase; }
  .h-big { color: var(--ink); font-weight: 800; letter-spacing: -.02em; line-height: 1.15; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); }
  .chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line2); border-radius: var(--pill); padding: 4px 10px; font-size: 12.5px; color: var(--body); white-space: nowrap; }
  .btn { display: inline-flex; align-items: center; gap: 8px; border-radius: var(--pill); padding: 10px 16px; font-size: 14px; font-weight: 700; transition: background .15s, border-color .15s, color .15s; text-decoration: none; }
  .btn-fill { background: var(--accent); color: #fff; }
  .btn-fill:hover { filter: brightness(1.1); }
  .btn-line { border: 1px solid var(--line2); color: var(--ink); }
  .btn-line:hover { border-color: var(--accent); color: var(--accent); }
  .btn:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .muted { color: var(--muted); }
  .accent { color: var(--accent); }
  .rule { width: 56px; height: 4px; background: var(--accent); }

  /* 표지 + 자기소개 — 왼쪽 타이틀 그림, 오른쪽 어두운 판에 글.
     그림은 왼쪽 2/3만 보이게 두어 오른쪽 위 게임 메뉴 글자(Game Start…)가 판 뒤로 들어가게 함 */
  .hero-art { position: absolute; left: 0; top: 0; bottom: 0; width: 66%; overflow: hidden; }
  .hero-img { width: 100%; height: 100%; object-fit: cover; object-position: 8% 20%; image-rendering: pixelated; display: block; }
  .hero-shade { position: absolute; inset: 0; pointer-events: none; background:
      linear-gradient(to right, rgb(17 17 17 / 0) 0%, rgb(17 17 17 / 0) 44%, rgb(17 17 17 / .85) 58%, rgb(17 17 17) 66%),
      linear-gradient(to top, rgb(17 17 17 / .9) 0%, rgb(17 17 17 / 0) 18%); }
  .hero-panel { position: absolute; top: 0; right: 0; bottom: 0; width: 44%; overflow-y: auto; overscroll-behavior: contain;
                display: flex; padding: 104px 6vw 84px 0; box-sizing: border-box; }
  .hero-copy { margin: auto 0; max-width: 560px; }
  @media (max-width: 1099px) { .hero-art { width: 58%; } .hero-panel { width: 52%; padding-right: 4vw; }
    .hero-shade { background: linear-gradient(to right, rgb(17 17 17 / 0) 0%, rgb(17 17 17 / 0) 34%, rgb(17 17 17 / .85) 50%, rgb(17 17 17) 58%), linear-gradient(to top, rgb(17 17 17 / .9) 0%, rgb(17 17 17 / 0) 18%); } }
  /* 좁은 화면: 그림 위 · 글 아래, 장 안에서 위아래로 스크롤 */
  @media (max-width: 759px) {
    .hero { overflow-y: auto; overscroll-behavior: contain; }
    .hero-art { position: relative; width: 100%; height: 46vh; }
    .hero-img { object-position: 22% 25%; }
    .hero-shade { inset: 0 0 auto 0; height: 46vh; background: linear-gradient(to top, rgb(17 17 17) 0%, rgb(17 17 17 / 0) 40%); }
    .hero-panel { position: static; width: auto; overflow: visible; padding: 0 16px 96px; margin-top: -48px; }
    .hero-copy { position: relative; }
  }

  /* 아래 조작 띠 */
  .bar { position: fixed; left: 0; right: 0; bottom: 0; height: 64px; display: flex; align-items: center; gap: 14px; padding: 0 24px;
         background: linear-gradient(to top, rgb(17 17 17 / .92), rgb(17 17 17 / 0)); z-index: 20; }
  .navbtn { width: 40px; height: 40px; display: grid; place-items: center; border: 1px solid var(--line2); border-radius: var(--pill); color: var(--ink); background: rgb(17 17 17 / .6); }
  .navbtn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .navbtn:disabled { opacity: .35; cursor: default; }
  .dots { display: flex; gap: 6px; flex: 1; justify-content: center; flex-wrap: wrap; }
  .dot { width: 8px; height: 8px; border-radius: 2px; background: var(--line2); border: 0; padding: 0; cursor: pointer; transition: width .2s, background .2s; }
  .dot.on { width: 22px; background: var(--accent); }
  .counter { font-family: var(--en); font-weight: 700; font-size: 13px; color: var(--ink); min-width: 64px; text-align: right; font-variant-numeric: tabular-nums; }
  /* 위 메뉴 — 미끄러지는 칸 버튼(지금 있는 주제에 손잡이가 붙음) */
  .top { position: fixed; top: 0; left: 0; right: 0; z-index: 25; padding: 16px 32px 12px; pointer-events: none;
         background: linear-gradient(to bottom, rgb(17 17 17 / .92) 0%, rgb(17 17 17 / .6) 60%, rgb(17 17 17 / 0)); }
  .top > * { pointer-events: auto; }
  .top-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; }
  .logo { justify-self: start; font-family: var(--en); font-weight: 700; font-size: 16px; letter-spacing: 3px; text-transform: uppercase; color: var(--ink); white-space: nowrap; }
  .logo i { color: var(--accent); font-style: normal; }
  .seg { position: relative; display: flex; padding: 5px; gap: 2px; background: var(--card); border: 1px solid var(--line); border-radius: calc(var(--pill) + 5px); }
  .seg-thumb { position: absolute; top: 5px; bottom: 5px; left: 0; border-radius: var(--pill); background: rgb(255 255 255 / .08); box-shadow: inset 0 -2px 0 var(--accent);
               transition: transform .35s cubic-bezier(.7,0,.2,1), width .35s cubic-bezier(.7,0,.2,1), opacity .2s; }
  .seg button { position: relative; z-index: 1; padding: 9px 18px; font-size: 14px; font-weight: 600; color: var(--muted); border-radius: var(--pill); white-space: nowrap; transition: color .2s; }
  .seg button:hover, .seg button.on { color: var(--ink); }
  .top-links { justify-self: end; display: flex; gap: 8px; }
  .top-links a { font-size: 13px; font-weight: 600; color: var(--muted); padding: 7px 12px; border: 1px solid var(--line); border-radius: var(--pill); }
  .top-links a:hover { color: var(--ink); border-color: var(--line2); }
  /* 프로젝트 장에서만 보이는 프로젝트 탭 */
  .tabs { display: flex; justify-content: center; gap: 6px; margin-top: 8px; flex-wrap: wrap; transition: opacity .25s, transform .25s; }
  .tabs.hide { opacity: 0; transform: translateY(-6px); pointer-events: none; }
  .tab { font-size: 13px; font-weight: 700; padding: 6px 12px; border-radius: 3px; color: var(--ink); transition: background .2s; white-space: nowrap; }
  .tab:hover { background: rgb(255 255 255 / .06); }
  .tab.on { background: var(--accent); color: #fff; }
  .tab .no { font-family: var(--en); margin-right: 6px; opacity: .7; }
  @media (max-width: 1099px) { .top-links { display: none; } .top-row { grid-template-columns: auto 1fr; } .seg { justify-self: end; } }
  @media (max-width: 759px) { .top { padding: 10px 12px 8px; } .logo, .tabs { display: none; } .top-row { grid-template-columns: 1fr; } .seg { justify-self: center; }
    .seg button { padding: 8px 9px; font-size: 13px; } }

  /* 이력 · 기술 */
  .block-h { display: flex; align-items: baseline; gap: 10px; padding-bottom: 10px; border-bottom: 1px solid var(--ink); margin-bottom: 4px; }
  .block-h b { font-family: var(--en); font-weight: 800; font-size: 15px; letter-spacing: .14em; color: var(--ink); }
  .block-h span { font-size: 12.5px; color: var(--muted); }
  .tl li { display: grid; grid-template-columns: 128px 1fr; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .tl time { font-family: var(--en); font-size: 12.5px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; line-height: 1.6; }
  .tl em { display: inline-block; margin-top: 4px; font-style: normal; font-family: 'Pretendard'; font-size: 11px; font-weight: 700; color: var(--accent); border: 1px solid var(--accent); border-radius: 3px; padding: 1px 6px; }
  .tl h3 { font-size: 14.5px; font-weight: 700; color: var(--ink); line-height: 1.45; }
  .tl h3 button:hover { color: var(--accent); }
  .tl p { font-size: 12.5px; color: var(--muted); margin-top: 2px; line-height: 1.5; }
  .tl-kind { font-family: var(--en); font-size: 11px; font-weight: 800; letter-spacing: .14em; color: var(--accent); margin: 14px 0 0; }
  .sk { text-align: left; padding: 12px 14px; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); transition: border-color .2s, background .2s; }
  .sk b { display: block; font-size: 14.5px; color: var(--ink); line-height: 1.35; }
  .sk span { display: block; margin-top: 4px; font-size: 11.5px; font-weight: 600; color: var(--muted); }
  .sk:hover { border-color: var(--line2); }
  .sk.on { border-color: var(--accent); background: rgb(236 28 35 / .08); box-shadow: inset 0 -2px 0 var(--accent); }
  .evi { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 4px 18px; }
  .evi li { display: grid; grid-template-columns: 150px 1fr; gap: 14px; padding: 11px 0; border-bottom: 1px solid var(--line); font-size: 14px; line-height: 1.6; }
  .evi li:last-child { border-bottom: 0; }
  .evi li button { text-align: left; font-weight: 700; color: var(--accent); font-size: 13px; line-height: 1.6; }
  .evi li button:hover { text-decoration: underline; text-underline-offset: 3px; }
  @media (max-width: 759px) { .tl li, .evi li { grid-template-columns: 1fr; gap: 2px; } }

  /* 자기소개서 */
  .quote { margin-top: 18px; padding: 16px 18px; background: var(--card); border-left: 3px solid var(--accent); border-radius: 0 var(--r) var(--r) 0; font-weight: 700; color: var(--ink); line-height: 1.55; font-size: 15px; }
  .quote small { display: block; margin-top: 8px; font-weight: 500; font-size: 12px; color: var(--muted); }
  .ch { display: grid; grid-template-columns: 30px 1fr; gap: 8px; width: 100%; text-align: left; padding: 9px 12px; border-radius: var(--r); transition: background .2s; }
  .ch i { font-style: normal; font-family: var(--en); font-weight: 800; font-size: 13px; color: var(--muted); line-height: 1.5; }
  .ch b { display: block; font-size: 14px; color: var(--body); line-height: 1.45; }
  .ch small { display: block; font-size: 12px; color: var(--muted); margin-top: 1px; }
  .ch:hover { background: rgb(255 255 255 / .04); }
  .ch.on { background: var(--ink); }
  .ch.on i { color: var(--accent); } .ch.on b { color: #111111; } .ch.on small { color: #55586A; }
  .page { position: relative; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; display: flex; flex-direction: column; min-height: 0; }
  .page-scroll { overflow-y: auto; overscroll-behavior: contain; padding: 32px 40px 36px; }
  .page .num { position: absolute; right: 26px; top: 14px; font-family: var(--en); font-weight: 800; font-size: 64px; line-height: 1; color: rgb(255 255 255 / .05); pointer-events: none; }
  .page p { font-size: 15px; line-height: 1.85; margin-top: 14px; }
  .page mark { background: linear-gradient(transparent 58%, rgb(236 28 35 / .38) 58%); color: var(--ink); font-weight: 700; padding: 0 1px; }
  .fade-in { animation: fadeIn .35s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .letter-grid { height: calc(100vh - 188px); min-height: 520px; }
  .page-scroll { flex: 1; min-height: 0; }
  @media (max-width: 1023px) { .letter-grid { height: auto; min-height: 0; } .page-scroll { overflow: visible; } }
  @media (max-width: 759px) { .page-scroll { padding: 22px 18px; } }

  /* 프로젝트 카드 */
  .pcard { display: flex; flex-direction: column; text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; transition: border-color .2s, transform .2s; }
  .pcard:hover { border-color: var(--accent); transform: translateY(-3px); }
  .pcard .thumb { position: relative; aspect-ratio: 16/10; background: #000; overflow: hidden; flex: none; }
  .pcard .thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .badge { position: absolute; top: 10px; font-size: 11.5px; font-weight: 700; padding: 3px 8px; border-radius: 3px; }
  .badge.no { left: 10px; background: var(--accent); color: #fff; font-family: var(--en); }
  .badge.team { right: 10px; background: rgb(17 17 17 / .82); color: var(--ink); }
  .chip.on-chip { border-color: var(--accent); color: var(--ink); background: rgb(236 28 35 / .12); }
  .gif-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin-right: 5px; vertical-align: middle; animation: gifPulse 1.4s ease-in-out infinite; }
  @keyframes gifPulse { 50% { opacity: .35; } }
  .clamp3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

  .progress { position: fixed; top: 0; left: 0; height: 3px; background: var(--accent); z-index: 30; transition: width .55s cubic-bezier(.7,0,.2,1); }
  .hint kbd { font-family: var(--en); font-size: 11px; border: 1px solid var(--line2); border-radius: 3px; padding: 1px 6px; color: var(--ink); }
  @media (max-width: 759px) { .bar { padding: 0 12px; gap: 8px; } .dots { display: none; } .hint { display: none; } }

  .shot { width: 100%; border-radius: var(--r); border: 1px solid var(--line); background: #000; object-fit: cover; }
  .feat-no { font-family: var(--en); font-weight: 800; font-size: 13px; color: var(--accent); letter-spacing: .08em; }
  @media (prefers-reduced-motion: reduce) { .rail, .progress { transition: none; } }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useCallback, useRef } = React;
const T = (k, v) => PFStr.t(k, v);
try { history.scrollRestoration = 'manual'; } catch { /* 그대로 */ }
const img = (id, src) => `../src/${id}/${src}`;

/* ───── 슬라이드 조각 ───── */
function Wrap({ children }) { return <div className="slide-inner"><div className="wrap">{children}</div></div>; }

// 표지 + 자기소개 한 장: 왼쪽은 타이틀 그림, 오른쪽 어두운 판에 이름·한 줄 소개·자기소개·연락처
function CoverSlide({ profile, coverImg }) {
  const paras = String(profile.intro || '').split('\n').filter(Boolean);
  return (
    <section className="slide hero" aria-label={T('page.intro')}>
      {coverImg && <div className="hero-art"><img className="hero-img" src={coverImg} alt="" /></div>}
      <div className="hero-shade" />
      <div className="hero-panel">
        <div className="hero-copy">
          <div className="eyebrow">{T('en.portfolio')}</div>
          <h1 className="h-big text-5xl xl:text-6xl mt-4">{profile.name}</h1>
          {profile.nameEn && <div className="mt-2 text-lg font-bold accent" style={{ fontFamily: 'var(--en)', letterSpacing: '.04em' }}>{profile.nameEn}</div>}
          {profile.headline && <p className="mt-6 text-xl xl:text-2xl font-bold leading-snug" style={{ color: 'var(--ink)' }}>{profile.headline}</p>}
          {paras.length > 0 && (
            <div className="mt-7 pt-6" style={{ borderTop: '1px solid var(--line)' }}>
              <div className="eyebrow mb-3">{T('en.about')}</div>
              <div className="space-y-3">
                {paras.map((p, i) => <p key={i} className="text-[15px] leading-relaxed">{p}</p>)}
              </div>
            </div>
          )}
          <div className="mt-7 flex flex-wrap gap-3">
            {profile.email && <a className="btn btn-fill" href={`mailto:${profile.email}`}>✉ {profile.email}</a>}
            {profile.github && <a className="btn btn-line" href={profile.github} target="_blank" rel="noopener">GitHub ↗</a>}
          </div>
        </div>
      </div>
    </section>
  );
}

// 이력 · 기술 한 장: 왼쪽 연표(교육 + 프로젝트 기간), 오른쪽 기술 칸 → 누르면 "프로젝트 | 근거" 줄
function HistorySkillsSlide({ history, skills, titleOf, goProject }) {
  const [sel, setSel] = useState(0);
  const s = skills[sel] || { evidence: [] };
  const projCount = (x) => new Set((x.evidence || []).map((e) => e.project).filter(Boolean)).size;
  return (
    <section className="slide" aria-label={`이력 · ${T('page.stack')}`}>
      <Wrap>
        <div className="grid lg:grid-cols-12 gap-10 lg:gap-14 items-start">
          <div className="lg:col-span-5">
            <div className="block-h"><b>HISTORY</b><span>교육 · 프로젝트</span></div>
            <ul className="tl">
              {history.map((h, i) => (
                <React.Fragment key={i}>
                  {h.kindStart && <li style={{ display: 'block', border: 0, padding: 0 }}><div className="tl-kind">{h.kindStart}</div></li>}
                  <li>
                    <time>{h.when}{h.badge && <><br /><em>{h.badge}</em></>}</time>
                    <div>
                      <h3>{h.project ? <button className="text-left" onClick={() => goProject(h.project)}>{h.title}</button> : h.title}</h3>
                      {h.sub && <p>{h.sub}</p>}
                    </div>
                  </li>
                </React.Fragment>
              ))}
            </ul>
          </div>
          <div className="lg:col-span-7">
            <div className="block-h"><b>{T('en.skills')}</b><span>{T('page.stack')} · {T('page.stack-note')}</span></div>
            <div className="grid grid-cols-2 sm:grid-cols-4 gap-2.5 mt-4">
              {skills.map((x, i) => (
                <button key={x.name} className={`sk ${i === sel ? 'on' : ''}`} onClick={() => setSel(i)} aria-pressed={i === sel}>
                  <b>{x.name}</b><span>근거 {(x.evidence || []).length}건 · 프로젝트 {projCount(x)}개</span>
                </button>
              ))}
            </div>
            <ul key={sel} className="evi mt-4 fade-in" aria-live="polite">
              {(s.evidence || []).map((e, i) => (
                <li key={i}>
                  {e.project ? <button onClick={() => goProject(e.project)}>{titleOf(e.project)}</button> : <span />}
                  <span>{e.text.replace(/`/g, '')}</span>
                </li>
              ))}
            </ul>
          </div>
        </div>
      </Wrap>
    </section>
  );
}

// 기술 문서 md에서 절마다 그림 찾기 — 기능 카드는 "그 기능 절(section)의 그림"(GIF 먼저), 남은 GIF는 프로젝트 장의 화면 모음으로
function docImages(md) {
  const lines = md.replace(/<!--[\s\S]*?-->/g, '').split('\n');
  const heads = [], imgs = [];
  let fence = false;
  lines.forEach((l, n) => {
    if (/^\s*```/.test(l)) { fence = !fence; return; }
    if (fence) return;
    const h = l.match(/^(#{1,6})\s+(.+?)\s*$/);
    if (h) { heads.push({ n, level: h[1].length, text: h[2].replace(/`/g, '').trim() }); return; }
    const re = /!\[([^\]]*)\]\((<[^>]+>|[^)\s]+)\)/g; let m;
    while ((m = re.exec(l))) {
      let src = m[2].replace(/^<|>$/g, '');
      try { src = decodeURI(src); } catch { /* 그대로 */ }
      if (/^https?:/i.test(src)) continue;
      imgs.push({ n, src: src.replace(/^\.\//, ''), alt: m[1].trim() });
    }
  });
  return { heads, imgs };
}
function sectionImages(d, section) {
  const want = String(section || '').replace(/`/g, '').trim();
  if (!want) return [];
  const i = d.heads.findIndex((h) => h.text === want || h.text.startsWith(want) || want.startsWith(h.text));
  if (i < 0) return [];
  const h = d.heads[i];
  const end = (d.heads.slice(i + 1).find((x) => x.level <= h.level) || { n: Infinity }).n;
  return d.imgs.filter((x) => x.n > h.n && x.n < end);
}
const isGif = (s) => /\.gif$/i.test(s);
const capText = (c) => (c && typeof c === 'object' ? c.text || '' : c || '');   // caption이 { text, verbatim }일 때도
const shortCap = (alt) => String(capText(alt)).split(/\s+—\s+/)[0];
function buildMedia(p, md) {
  const d = docImages(md);
  const features = (p.highlights || []).map((h) => {
    const inSec = sectionImages(d, h.section);
    const gifs = inSec.filter((x) => isGif(x.src));
    if (gifs.length) return gifs;                                   // 그 절에 GIF가 있으면 GIF(여러 개면 모두)
    if (h.image && h.image.src) return [{ src: h.image.src, alt: h.image.caption || h.title, w: h.image.w, h: h.image.h }];
    return inSec.slice(0, 1);
  });
  const used = new Set(features.flat().map((x) => x.src));
  const extra = d.imgs.filter((x) => isGif(x.src) && !used.has(x.src)).filter((x, i, a) => a.findIndex((y) => y.src === x.src) === i);
  return { features, extra };
}

function parseLetter(md) {
  const text = md.replace(/<!--[\s\S]*?-->/g, '');
  const parts = text.split(/^##\s+/m);
  const head = parts.shift() || '';
  const chapters = parts.map((sec) => {
    const [first, ...rest] = sec.split('\n');
    const m = first.trim().match(/^(\d+)\.\s*(.+)$/);
    const full = m ? m[2] : first.trim();
    const [title, sub] = full.split(/\s+—\s+/);
    const paras = rest.join('\n').split(/\n\s*\n/).map((p) => p.split('\n').map((l) => l.trim()).filter(Boolean).join(' ')).filter(Boolean);
    return { no: m ? +m[1] : 0, title: title.trim(), sub: (sub || '').trim(), paras };
  }).filter((c) => c.paras.length);
  // 머리줄의 교육 과정: "… · 기관 「과정 이름」 시작 ~ 끝(수료 예정)"
  let course = null;
  const cm = head.match(/·\s*([^·「\n]+?)\s*「([^」]+)」\s*(\d{4}-\d{2}-\d{2})\s*~\s*(\d{4}-\d{2}-\d{2})\s*(?:\(([^)]+)\))?/);
  if (cm) course = { org: cm[1].trim(), name: cm[2].trim(), start: cm[3], end: cm[4], note: (cm[5] || '').trim() };
  return { chapters, course };
}

  }, []);

  // 슬라이드 목록 만들기
  const slides = [];
  if (state) {

    { group: 'intro', label: T('page.nav-intro') },

  const curProject = cur.project || cur.of || null;
  const firstOf = (g) => slides.findIndex((s) => s.group === g);

  // 칸 버튼의 손잡이를 지금 주제 칸으로 옮김
  const segRef = useRef(null);
  const [thumb, setThumb] = useState({ x: 0, w: 0, on: false });
  useEffect(() => {
    const place = () => {
      const seg = segRef.current; if (!seg) return;
      const b = seg.querySelector('button.on');
      if (!b) { setThumb((t) => ({ ...t, on: false })); return; }
      setThumb({ x: b.offsetLeft, w: b.offsetWidth, on: true });
    };
    place();
    window.addEventListener('resize', place);
    return () => window.removeEventListener('resize', place);
  }, [idx, n]);

  const go = useCallback((i) => setIdx((cur) => Math.max(0, Math.min(n - 1, typeof i === 'function' ? i(cur) : i))), [n]);
  const goProject = useCallback((id) => { const i = slides.findIndex((s) => s.project === id); if (i >= 0) go(i); }, [n]);

  // 주소(#key)와 맞추기 — 새로고침·공유해도 같은 장
  useEffect(() => {
    if (!n) return;
    const fromHash = () => { const k = decodeURIComponent(location.hash.slice(1)); const i = slides.findIndex((s) => s.key === k); if (i >= 0) setIdx(i); };
    fromHash();
    window.addEventListener('hashchange', fromHash);
    return () => window.removeEventListener('hashchange', fromHash);
  }, [n]);
  useEffect(() => { if (n && slides[idx]) history.replaceState(null, '', '#' + slides[idx].key); }, [idx, n]);

  // 키보드: ← → (+ PageUp/PageDown · Home/End · Space)
  useEffect(() => {
    const onKey = (e) => {
      if (e.altKey || e.ctrlKey || e.metaKey) return;
      if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
      const k = e.key;
      if (k === 'ArrowRight' || k === 'PageDown' || (k === ' ' && !e.shiftKey)) { e.preventDefault(); go((c) => c + 1); }
      else if (k === 'ArrowLeft' || k === 'PageUp' || (k === ' ' && e.shiftKey)) { e.preventDefault(); go((c) => c - 1); }
      else if (k === 'Home') { e.preventDefault(); go(0); }
      else if (k === 'End') { e.preventDefault(); go(n - 1); }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [go, n]);

  // 새 장으로 오면 그 장의 안쪽 스크롤을 맨 위로, 화면 밖 장은 Tab으로 못 들어가게
  useEffect(() => {
    // 페이지 자체는 가로로 밀리지 않게(장 이동은 레일의 transform만으로)
    document.documentElement.scrollLeft = 0; document.body.scrollLeft = 0;
    document.querySelectorAll('.slide').forEach((s, i) => {
      s.inert = i !== idx;
      if (i === idx) { const inner = s.querySelector('.slide-inner'); if (inner) inner.scrollTop = 0; }
    });
  }, [idx, n]);

  // 휴대폰: 좌우로 밀어 넘기기
  const onTouchStart = (e) => { const t = e.touches[0]; touch.current = { x: t.clientX, y: t.clientY }; };
  const onTouchEnd = (e) => {
    if (!touch.current) return;
    const t = e.changedTouches[0], dx = t.clientX - touch.current.x, dy = t.clientY - touch.current.y;
    touch.current = null;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) go((c) => c + (dx < 0 ? 1 : -1));
  };

  if (err) return <div className="p-10" style={{ color: 'var(--ink)' }}>데이터를 읽지 못했습니다: {err}<br /><span className="muted text-sm">로컬 서버(python -m http.server 4600)로 열었는지, /portfolio-build를 했는지 확인해 주세요.</span></div>;
  if (!state) return <div className="h-full grid place-items-center muted">…</div>;

  return (
    <>
      <div className="progress" style={{ width: `${((idx + 1) / n) * 100}%` }} />
      <header className="top">
        <div className="top-row">
          <button className="logo" onClick={() => go(0)}>{state.pf.profile.nameEn || state.pf.profile.name}<i>.</i></button>
          <nav className="seg" ref={segRef} aria-label="주제 바로 가기">
            <span className="seg-thumb" style={{ width: thumb.w, transform: `translateX(${thumb.x}px)`, opacity: thumb.on ? 1 : 0 }} />
            {TOPICS.map((t) => (
              <button key={t.group} className={cur.group === t.group ? 'on' : ''} onClick={() => go(firstOf(t.group))} aria-current={cur.group === t.group ? 'true' : undefined}>{t.label}</button>
            ))}
          </nav>
          <div className="top-links">
            {state.pf.profile.github && <a href={state.pf.profile.github} target="_blank" rel="noopener">GitHub ↗</a>}
            {state.pf.profile.email && <a href={`mailto:${state.pf.profile.email}`}>Email</a>}
          </div>
        </div>
        <div className={`tabs ${cur.group === 'projects' ? '' : 'hide'}`} aria-label={T('page.nav-projects')}>
          {state.projects.map((p, i) => (
            <button key={p.id} className={`tab ${curProject === p.id ? 'on' : ''}`} onClick={() => goProject(p.id)} tabIndex={cur.group === 'projects' ? 0 : -1}>
              <span className="no">{String(i + 1).padStart(2, '0')}</span>{p.title.replace(/\s*\(.*\)$/, '').replace(/\s+—.*$/, '')}
            </button>
          ))}
        </div>
      </header>
      <main className="h-full" onTouchStart={onTouchStart} onTouchEnd={onTouchEnd}>
        <div className="rail" style={{ transform: `translateX(-${idx * 100}vw)` }}>
          {slides.map((s) => <React.Fragment key={s.key}>{s.el(goProject)}</React.Fragment>)}
        </div>
      </main>
      <nav className="bar" aria-label="슬라이드 이동">
        <button className="navbtn" onClick={() => go((c) => c - 1)} disabled={idx === 0} aria-label="이전">←</button>
        <button className="navbtn" onClick={() => go((c) => c + 1)} disabled={idx === n - 1} aria-label="다음">→</button>
        <span className="hint text-xs muted ml-2"><kbd>←</kbd> <kbd>→</kbd> 키로 넘기기</span>
        <div className="dots">{slides.map((s, i) => <button key={s.key} className={`dot ${i === idx ? 'on' : ''}`} onClick={() => go(i)} aria-label={s.label} title={s.label} />)}</div>
        <span className="counter">{String(idx + 1).padStart(2, '0')} / {String(n).padStart(2, '0')}</span>
      </nav>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
