<title>슬라임 카드 뽑기 목록</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* 레이아웃: 위에 고정 진행 막대, 아래로 작업 폴더(세션)별 묶음 → 카드 줄 */
:root{
  --bg:#f3f5f4; --panel:#ffffff; --ink:#1c2422; --muted:#5d6b67; --line:#dbe2df;
  --accent:#138a7e; --accent-ink:#ffffff; --soft:#e6f2f0; --warn:#9a5b00; --warn-bg:#fff3dc;
  --fire:#d2602a; --water:#1b93a8; --earth:#9b7429; --air:#5f80cc; --neutral:#b85d86; --misc:#6b7772;
  --t-n:#7b8784; --t-r:#2f8f5b; --t-sr:#7a4fc2; --t-u:#c76a12; --t-l:#b48a00;
  --f-body:"IBM Plex Sans KR",system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141a19; --panel:#1c2423; --ink:#e4ebe9; --muted:#9aa9a5; --line:#2c3735;
  --accent:#3cc4b4; --accent-ink:#0d1716; --soft:#1f3532; --warn:#f0b65a; --warn-bg:#3a2d17;
  --t-n:#9aa6a3; --t-r:#5cc48a; --t-sr:#a98ae8; --t-u:#f09a4a; --t-l:#e0bb3a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a19; --panel:#1c2423; --ink:#e4ebe9; --muted:#9aa9a5; --line:#2c3735;
  --accent:#3cc4b4; --accent-ink:#0d1716; --soft:#1f3532; --warn:#f0b65a; --warn-bg:#3a2d17;
  --t-n:#9aa6a3; --t-r:#5cc48a; --t-sr:#a98ae8; --t-u:#f09a4a; --t-l:#e0bb3a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
header.top .wrap{padding-block:12px;display:flex;flex-direction:column;gap:10px}
.row1{display:flex;flex-wrap:wrap;align-items:center;gap:12px;justify-content:space-between}
h1{font-size:1.15rem;margin:0;font-weight:700;text-wrap:balance}
.prog{display:flex;align-items:center;gap:10px;font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem}
.bar{width:140px;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0}
.toggle{display:inline-flex;align-items:center;gap:6px;font-size:.9rem;cursor:pointer;user-select:none}
.toggle input{accent-color:var(--accent);width:16px;height:16px}
nav.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
nav.chips a{flex:none;font-size:.82rem;padding:4px 10px;border-radius:99px;border:1px solid var(--line);color:var(--ink);text-decoration:none;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
nav.chips a:hover,nav.chips a:focus-visible{border-color:var(--accent);outline:none}
nav.chips a .n{color:var(--muted);font-variant-numeric:tabular-nums}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c,var(--misc));flex:none}
.intro{color:var(--muted);font-size:.9rem;margin:18px 0 6px;max-width:68ch}
section.group{margin-top:22px;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;scroll-margin-top:130px}
.ghead{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 12px;padding:14px 16px;border-bottom:1px solid var(--line);border-left:4px solid var(--c,var(--misc))}
.ghead h2{font-size:1.02rem;margin:0}
.ghead .path{font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}
.ghead .cnt{margin-left:auto;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.prep{display:grid;gap:10px;padding:12px 16px;background:var(--soft);border-bottom:1px solid var(--line)}
.step{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.88rem}
.step b{font-weight:500;min-width:4.5em}
.file{font-family:var(--f-mono);font-size:.78rem;padding:2px 8px;border-radius:6px;background:var(--panel);border:1px solid var(--line);word-break:break-all}
.notes{font-size:.82rem;color:var(--muted);margin:0;padding-left:1.1em}
details.setup summary{cursor:pointer;font-size:.85rem;color:var(--accent)}
details.setup pre{max-height:260px}
pre{font-family:var(--f-mono);font-size:.8rem;line-height:1.5;white-space:pre-wrap;word-break:break-word;margin:6px 0 0;padding:10px 12px;background:var(--bg);border:1px solid var(--line);border-radius:8px;overflow:auto}
button{font:inherit;font-size:.85rem;border-radius:7px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:5px 12px;cursor:pointer;white-space:nowrap}
button:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:500}
button.ok{background:var(--soft);color:var(--accent);border-color:var(--accent)}
ul.cards{list-style:none;margin:0;padding:0}
li.card{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:14px 16px;border-top:1px solid var(--line)}
li.card:first-child{border-top:0}
li.card.done{opacity:.55}
li.card.done .pname{text-decoration:line-through}
.chk{padding-top:3px}
.chk input{width:20px;height:20px;accent-color:var(--accent);cursor:pointer}
.cbody{min-width:0;display:flex;flex-direction:column;gap:6px}
.cline{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.cid{font-family:var(--f-mono);font-size:.8rem;font-weight:500}
.tier{font-size:.72rem;font-weight:700;letter-spacing:.04em;padding:1px 7px;border-radius:99px;color:var(--panel);background:var(--tc,var(--t-n))}
.pname{font-weight:700}
.status{font-size:.8rem;color:var(--muted)}
.note{font-size:.82rem;color:var(--warn);background:var(--warn-bg);padding:3px 8px;border-radius:6px;align-self:flex-start}
.pwrap pre{margin:0;max-height:5.2em;overflow:hidden;position:relative}
.pwrap.open pre{max-height:none}
.actions{display:flex;flex-wrap:wrap;gap:6px}
.empty{padding:16px;color:var(--muted);font-size:.9rem}
@media (max-width:560px){.bar{width:90px}.ghead .cnt{margin-left:0;width:100%}}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .3s}}
</style>

<header class="top">
  <div class="wrap">
    <div class="row1">
      <h1>슬라임 카드 뽑기 목록</h1>
      <div class="prog"><span id="progText">불러오는 중…</span><span class="bar"><i id="progBar"></i></span></div>
      <label class="toggle"><input type="checkbox" id="onlyLeft">남은 것만 보기</label>
    </div>
    <nav class="chips" id="nav" aria-label="작업 묶음"></nav>
  </div>
</header>

<main class="wrap">
  <p class="intro">묶음 하나가 새 대화 하나예요. ① 세션 설정을 복사해 붙여 넣고 ② 기준 그림을 첨부한 다음 ③ 카드 줄을 한 장씩 복사해 보내세요. 다 뽑은 카드는 체크하면 이 브라우저에 기억돼요. 그림 파일은 각 폴더의 <span class="file">결과/</span>에 적힌 이름으로 저장하세요.</p>
  <div id="groups"><p class="empty">목록을 불러오는 중이에요.</p></div>
</main>

<script>
(function(){
  const ELEM = {"불":"--fire","물":"--water","땅":"--earth","공기":"--air","무속성":"--neutral"};
  const TIER = {N:["노말","--t-n"],R:["레어","--t-r"],SR:["수퍼레어","--t-sr"],U:["유니크","--t-u"],L:["레전더리","--t-l"],NR:["노말 · 레어","--t-n"]};
  const KEY = "cardQueue.done.v1";
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch(e) { saved = {}; }
  function save(){ try { localStorage.setItem(KEY, JSON.stringify(saved)); } catch(e) {} }
  let DATA = null;
  const isDone = c => (c.file in saved) ? saved[c.file] : c.done;

  function el(tag, attrs, ...kids){
    const n = document.createElement(tag);
    for (const k in (attrs||{})) {
      if (k === "class") n.className = attrs[k];
      else if (k === "style") n.setAttribute("style", attrs[k]);
      else if (k.startsWith("on")) n.addEventListener(k.slice(2), attrs[k]);
      else n.setAttribute(k, attrs[k]);
    }
    for (const kid of kids) if (kid != null) n.append(kid);
    return n;
  }
  function copyBtn(label, getText, primary){
    const b = el("button", {type:"button", class: primary ? "primary" : ""}, label);
    b.addEventListener("click", () => {
      const text = getText();
      const ok = () => { b.textContent = "복사됨"; b.className = "ok"; setTimeout(() => { b.textContent = label; b.className = primary ? "primary" : ""; }, 1400); };
      const fail = () => { b.textContent = "글자를 직접 선택해 복사하세요"; setTimeout(() => { b.textContent = label; }, 2200); };
      try { navigator.clipboard.writeText(text).then(ok, fail); } catch(e) { fail(); }
    });
    return b;
  }
  const groupId = g => "g-" + g.key.replace(/[^0-9A-Za-z]+/g, "-").replace(/^-|-$/g,"") + "-" + DATA.groups.indexOf(g);

  function render(){
    const only = document.getElementById("onlyLeft").checked;
    const host = document.getElementById("groups");
    const nav = document.getElementById("nav");
    host.replaceChildren(); nav.replaceChildren();
    let total = 0, done = 0;
    for (const g of DATA.groups){
      const left = g.cards.filter(c => !isDone(c)).length;
      total += g.cards.length; done += g.cards.length - left;
      const color = ELEM[g.elem] ? `var(${ELEM[g.elem]})` : "var(--misc)";
      const id = groupId(g);
      nav.append(el("a", {href:"#"+id, style:`--c:${color}`, onclick:(e)=>{e.preventDefault(); document.getElementById(id).scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"});}},
        el("span",{class:"dot"}), `${g.elem} ${g.label.replace(" · 레어","~R").replace("5속성 · 한 대화","SR").replace("유니크 · 레전더리","U · L")}`, el("span",{class:"n"}, left ? `${left}` : "✓")));
      if (only && left === 0) continue;

      const sec = el("section", {class:"group", id, style:`--c:${color}`});
      sec.append(el("div",{class:"ghead"},
        el("span",{class:"dot"}), el("h2",null,`${g.elem} · ${g.label}`), el("span",{class:"path"}, `카드아트_작업키트/${g.key}`),
        el("span",{class:"cnt"}, `${g.cards.length - left} / ${g.cards.length} 완료`)));

      const prep = el("div",{class:"prep"});
      const setup = DATA.setups[g.setup];
      prep.append(el("div",{class:"step"}, el("b",null,"① 세션"), copyBtn("세션 설정 복사", () => setup, false),
        el("details",{class:"setup", style:"flex-basis:100%"}, el("summary",null,"세션 설정 내용 보기"), el("pre",null,setup))));
      const anc = el("div",{class:"step"}, el("b",null,"② 첨부"));
      if (g.anchors.length) g.anchors.forEach(a => anc.append(el("span",{class:"file"}, a)));
      else anc.append(el("span",{class:"status"},"첨부 없음"));
      prep.append(anc);
      const notes = g.attach.filter(t => !t.startsWith("첨부:"));
      if (notes.length) prep.append(el("ul",{class:"notes"}, ...notes.map(t => el("li",null,t.replace(/^\(|\)$/g,"")))));
      sec.append(prep);

      const ul = el("ul",{class:"cards"});
      const list = only ? g.cards.filter(c => !isDone(c)) : g.cards;
      for (const c of list){
        const d = isDone(c);
        const t = TIER[c.tier];
        const cb = el("input",{type:"checkbox", id:"chk-"+c.file, "aria-label": `${c.name} 다 뽑음`});
        cb.checked = d;
        cb.addEventListener("change", () => { saved[c.file] = cb.checked; save(); render(); });
        const pw = el("div",{class:"pwrap"}, el("pre",null,c.prompt));
        const more = el("button",{type:"button"},"펼치기");
        more.addEventListener("click", () => { pw.classList.toggle("open"); more.textContent = pw.classList.contains("open") ? "접기" : "펼치기"; });
        ul.append(el("li",{class:"card"+(d?" done":"")},
          el("div",{class:"chk"}, cb),
          el("div",{class:"cbody"},
            el("div",{class:"cline"},
              el("span",{class:"cid"}, c.id),
              t ? el("span",{class:"tier", style:`--tc:var(${t[1]})`}, t[0]) : null,
              el("span",{class:"pname"}, c.name),
              el("span",{class:"file", title:"저장할 파일 이름"}, c.file)),
            c.status ? el("span",{class:"status"}, c.status) : null,
            c.note ? el("span",{class:"note"}, "※ " + c.note) : null,
            pw,
            el("div",{class:"actions"}, copyBtn("③ 프롬프트 복사", () => c.prompt, true), copyBtn("파일 이름 복사", () => c.file.replace(/\.png$/i, ""), false), more))));
      }
      if (!list.length) ul.append(el("li",{class:"empty"},"이 묶음은 다 뽑았어요."));
      sec.append(ul);
      host.append(sec);
    }
    if (!host.children.length) host.append(el("p",{class:"empty"},"남은 카드가 없어요. 전부 다 뽑았어요!"));
    document.getElementById("progText").textContent = `${done} / ${total} 완료`;
    document.getElementById("progBar").style.width = (total ? done/total*100 : 0) + "%";
  }

  document.getElementById("onlyLeft").addEventListener("change", e => { try { localStorage.setItem(KEY+".only", e.target.checked ? "1" : ""); } catch(_){} render(); });
  try { document.getElementById("onlyLeft").checked = localStorage.getItem(KEY+".only") === "1"; } catch(_){}

  fetch("data.json").then(r => r.json()).then(d => { DATA = d; render(); })
    .catch(() => { document.getElementById("groups").replaceChildren(el("p",{class:"empty"},"목록 파일을 불러오지 못했어요. 페이지를 새로 고쳐 주세요.")); });
})();
</script>
