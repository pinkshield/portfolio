<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>포트폴리오</title>
<link rel="icon" href="data:," />
<!-- 직접 생성 모드(/portfolio-custom) — 키보드 ← → 로 넘기는 슬라이드형 포트폴리오.
     내용은 ../data/*.json에서만 읽습니다. /portfolio-build를 다시 하면 이 페이지도 최신이 됩니다.
     색·모양·영문 글꼴은 ../theme/theme.css의 손잡이(--t-*)를 따릅니다. UI 문구는 ../theme/strings.tsv(문구 표)를 따릅니다. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/montserrat@5.2.8/latin-700.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/montserrat@5.2.8/latin-800.css" />
<link rel="stylesheet" href="../theme/theme.css" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
<script src="../assets/strings.js"></script>
<style>
  :root {
    --bg: var(--t-bg, #111111);
    --card: var(--t-surface, #181A26);
    --ink: var(--t-ink, #FFFFFF);
    --body: var(--t-body, #EBEBEB);
    --muted: var(--t-muted, #A6A8B4);
    --line: var(--t-line, #262B44);
    --line2: var(--t-line-2, #3E4566);
    --accent: var(--t-accent, #EC1C23);
    --r: var(--t-radius, 6px);
    --pill: var(--t-pill, 4px);
    --en: var(--t-display, 'Montserrat'), 'Montserrat', 'Pretendard', sans-serif;
  }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--body); overflow: hidden; overflow: clip; }
  main { overflow: clip; }   /* 포커스·스크롤 이동이 가로 레일을 밀지 못하게(장 이동은 transform만) */
  body { font-family: 'Pretendard', system-ui, sans-serif; -webkit-font-smoothing: antialiased; word-break: keep-all; }
  #root { height: 100%; }

  /* 슬라이드 레일 — 가로로 한 줄, transform으로 이동 (마우스 휠로 넘어가지 않음) */
  .rail { display: flex; height: 100%; transition: transform .55s cubic-bezier(.7,0,.2,1); will-change: transform; }
  .slide { flex: 0 0 100vw; width: 100vw; height: 100%; position: relative; overflow: hidden; }
  .slide-inner { height: 100%; overflow-y: auto; overscroll-behavior: contain; padding: 108px 7vw 100px; box-sizing: border-box; }
  .slide-inner > .wrap { max-width: 1240px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; justify-content: center; }
  @media (max-width: 759px) { .slide-inner { padding: 70px 16px 124px; } }

  .eyebrow { font-family: var(--en); font-weight: 800; letter-spacing: .18em; font-size: 12px; color: var(--accent); text-transform: uppercase; }
  .h-big { color: var(--ink); font-weight: 800; letter-spacing: -.02em; line-height: 1.15; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); }
  .chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line2); border-radius: var(--pill); padding: 4px 10px; font-size: 12.5px; color: var(--body); white-space: nowrap; }
  .btn { display: inline-flex; align-items: center; gap: 8px; border-radius: var(--pill); padding: 10px 16px; font-size: 14px; font-weight: 700; transition: background .15s, border-color .15s, color .15s; text-decoration: none; }
  .btn-fill { background: var(--accent); color: #fff; }
  .btn-fill:hover { filter: brightness(1.1); }
  .btn-line { border: 1px solid var(--line2); color: var(--ink); }
  .btn-line:hover { border-color: var(--accent); color: var(--accent); }
  .btn:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .muted { color: var(--muted); }
  .accent { color: var(--accent); }
  .rule { width: 56px; height: 4px; background: var(--accent); }

  /* 표지 + 자기소개 — 왼쪽 타이틀 그림, 오른쪽 어두운 판에 글.
     그림은 왼쪽 2/3만 보이게 두어 오른쪽 위 게임 메뉴 글자(Game Start…)가 판 뒤로 들어가게 함 */
  .hero-art { position: absolute; left: 0; top: 0; bottom: 0; width: 66%; overflow: hidden; }
  .hero-img { width: 100%; height: 100%; object-fit: cover; object-position: 8% 20%; image-rendering: pixelated; display: block; }
  .hero-shade { position: absolute; inset: 0; pointer-events: none; background:
      linear-gradient(to right, rgb(17 17 17 / 0) 0%, rgb(17 17 17 / 0) 44%, rgb(17 17 17 / .85) 58%, rgb(17 17 17) 66%),
      linear-gradient(to top, rgb(17 17 17 / .9) 0%, rgb(17 17 17 / 0) 18%); }
  .hero-panel { position: absolute; top: 0; right: 0; bottom: 0; width: 44%; overflow-y: auto; overscroll-behavior: contain;
                display: flex; padding: 104px 6vw 84px 0; box-sizing: border-box; }
  .hero-copy { margin: auto 0; max-width: 560px; }
  @media (max-width: 1099px) { .hero-art { width: 58%; } .hero-panel { width: 52%; padding-right: 4vw; }
    .hero-shade { background: linear-gradient(to right, rgb(17 17 17 / 0) 0%, rgb(17 17 17 / 0) 34%, rgb(17 17 17 / .85) 50%, rgb(17 17 17) 58%), linear-gradient(to top, rgb(17 17 17 / .9) 0%, rgb(17 17 17 / 0) 18%); } }
  /* 좁은 화면: 그림 위 · 글 아래, 장 안에서 위아래로 스크롤 */
  @media (max-width: 759px) {
    .hero { overflow-y: auto; overscroll-behavior: contain; }
    .hero-art { position: relative; width: 100%; height: 46vh; }
    .hero-img { object-position: 22% 25%; }
    .hero-shade { inset: 0 0 auto 0; height: 46vh; background: linear-gradient(to top, rgb(17 17 17) 0%, rgb(17 17 17 / 0) 40%); }
    .hero-panel { position: static; width: auto; overflow: visible; padding: 0 16px 124px; margin-top: -48px; }
    .hero-copy { position: relative; }
  }

  /* 아래 조작 띠 */
  .bar { position: fixed; left: 0; right: 0; bottom: 0; height: 64px; display: flex; align-items: center; gap: 14px; padding: 0 24px;
         background: linear-gradient(to top, rgb(17 17 17 / .92), rgb(17 17 17 / 0)); z-index: 20; }
  .navbtn { width: 40px; height: 40px; display: grid; place-items: center; border: 1px solid var(--line2); border-radius: var(--pill); color: var(--ink); background: rgb(17 17 17 / .6); }
  .navbtn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .navbtn:disabled { opacity: .35; cursor: default; }
  .dots { display: flex; gap: 6px; flex: 1; justify-content: center; flex-wrap: wrap; }
  .dot { width: 8px; height: 8px; border-radius: 2px; background: var(--line2); border: 0; padding: 0; cursor: pointer; transition: width .2s, background .2s; }
  .dot.on { width: 22px; background: var(--accent); }
  .counter { font-family: var(--en); font-weight: 700; font-size: 13px; color: var(--ink); min-width: 64px; text-align: right; font-variant-numeric: tabular-nums; }
  /* 위 메뉴 — 미끄러지는 칸 버튼(지금 있는 주제에 손잡이가 붙음) */
  .top { position: fixed; top: 0; left: 0; right: 0; z-index: 25; padding: 16px 32px 12px; pointer-events: none;
         background: linear-gradient(to bottom, rgb(17 17 17 / .97) 0%, rgb(17 17 17 / .97) calc(100% - 14px), rgb(17 17 17 / 0) 100%); }   /* 스크롤한 글이 메뉴 · 탭 밑에서 비쳐 겹쳐 보이지 않게(11-26) */
  .top > * { pointer-events: auto; }
  .top-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; }
  .logo { justify-self: start; font-family: var(--en); font-weight: 700; font-size: 16px; letter-spacing: 3px; text-transform: uppercase; color: var(--ink); white-space: nowrap; }
  .logo i { color: var(--accent); font-style: normal; }
  .seg { position: relative; display: flex; padding: 5px; gap: 2px; background: var(--card); border: 1px solid var(--line); border-radius: calc(var(--pill) + 5px); }
  .seg-thumb { position: absolute; top: 5px; bottom: 5px; left: 0; border-radius: var(--pill); background: rgb(255 255 255 / .08); box-shadow: inset 0 -2px 0 var(--accent);
               transition: transform .35s cubic-bezier(.7,0,.2,1), width .35s cubic-bezier(.7,0,.2,1), opacity .2s; }
  .seg button { position: relative; z-index: 1; padding: 9px 18px; font-size: 14px; font-weight: 600; color: var(--muted); border-radius: var(--pill); white-space: nowrap; transition: color .2s; }
  .seg button:hover, .seg button.on { color: var(--ink); }
  .top-links { justify-self: end; display: flex; gap: 8px; }
  .top-links a { font-size: 13px; font-weight: 600; color: var(--muted); padding: 7px 12px; border: 1px solid var(--line); border-radius: var(--pill); }
  .top-links a:hover { color: var(--ink); border-color: var(--line2); }
  .to-contact { font-size: 13px; font-weight: 700; color: var(--ink); padding: 7px 12px; border: 1px solid var(--accent); border-radius: var(--pill); background: transparent; cursor: pointer; white-space: nowrap; }
  .to-contact:hover, .to-contact.on { background: var(--accent); color: #fff; }
  .btn-ghost { background: transparent; border: 1px solid transparent; color: var(--muted); }
  .btn-ghost:hover { color: var(--ink); border-color: var(--line); }
  /* 연락처 장 */
  /* 연락처 장: 표지 틀(.hero)을 그대로 씀 — 클리어 화면은 가운데(Game Clear · 캐릭터 · Menu/Exit)가 보이게 */
  /* 가로 화면: 그림은 높이에 맞춰 커지므로 화면 비율마다 「- Game Clear -」(그림 가로 480~1095 / 1579, 높이 884)의 가운데를
     화면 23% 지점(글 판 페이드 44% 앞)에 둠. 왼쪽 끝 = 23vw − 787.5 × (100vh / 884). 초광각에서는 그림 오른쪽 끝이 그림 칸(66vw) 안으로 들어오지 않게 clamp */
  .end-img { object-position: clamp(66vw - 178.6vh, 23vw - 89.08vh, 0px) 50%; }
  @media (max-width: 1099px) { .end-img { object-position: 50% 45%; } }
  /* 세로 화면(세로 모니터 · 폰): 클리어 화면을 위에 통째로(가로 폭 가득), 아래에 연락처 — 경계는 페이드(11-26 건우 님) */
  @media (orientation: portrait) {
    .hero.contact { overflow-y: auto; overscroll-behavior: contain; }
    .hero.contact { display: flex; flex-direction: column; }
    /* 높이는 그림 비율과 화면 절반 중 큰 쪽 — 세로가 긴 모니터에서도 아래가 비지 않게(넘치는 양옆만 잘림, 가운데 클리어 장면은 그대로) */
    .contact .hero-art { position: relative; flex: none; width: 100%; height: max(calc(100vw * 884 / 1579), 50vh); }
    .contact .end-img { object-position: 50% 50%; }
    .contact .hero-shade { inset: 0 0 auto 0; height: max(calc(100vw * 884 / 1579), 50vh); background:
        linear-gradient(to top, rgb(17 17 17) 0%, rgb(17 17 17 / 0) 32%),
        linear-gradient(to bottom, rgb(17 17 17 / .75) 0%, rgb(17 17 17 / 0) 18%); }
    .contact .hero-panel { position: relative; inset: auto; flex: 1 0 auto; width: auto; overflow: visible; display: flex; flex-direction: column; justify-content: flex-start; padding: 0 6vw 124px; margin-top: -72px; }
    .contact .hero-copy { position: relative; width: 100%; max-width: 820px; margin: 0 auto; font-size: clamp(16px, 1.6vw, 20px); }
    .contact .h-big { font-size: clamp(36px, 5vw, 64px); }
  }
  /* 폰: 그림이 너무 납작해지므로 표지처럼 높이를 주고 가운데(클리어 글자 · 캐릭터)만 */
  @media (orientation: portrait) and (max-width: 759px) {
    .contact .hero-art { aspect-ratio: auto; height: 50vh; max-height: none; }
    .contact .end-img { object-position: 50% 40%; }
    .contact .hero-shade { height: 50vh; }
    .contact .hero-panel { padding: 0 16px 124px; margin-top: -64px; }
  }
  .contact .credits { padding: 16px 20px; }
  .contact .cr-list li { padding: 6px 0; }
  .contact .cr-mail a { font-size: 19px; }
  .contact .cr-links { font-size: 13.5px; gap: 4px 14px; }
  .contact .cr-links a.v { color: var(--accent); }
  .contact .cr-links a.v:hover { filter: brightness(1.15); }
  .contact .back-top { margin-top: 14px; }
  /* 「처음으로」를 그림 속 게임 메뉴(Menu / Exit)처럼 — 깜빡이는 ▶ 커서, 올리면 한 칸 들어감 */
  .back-top.game-menu { display: inline-flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 800; letter-spacing: .02em; color: var(--ink); transition: transform .12s steps(2); }
  .game-menu i { font-style: normal; font-size: 13px; color: var(--accent); animation: menu-blink 1s steps(1) infinite; }
  .back-top.game-menu:hover, .back-top.game-menu:focus-visible { color: var(--ink); transform: translateX(6px); }
  .game-menu:hover i { animation: none; }
  @keyframes menu-blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .game-menu i { animation: none; } .game-menu { transition: none; } }
  .back-top { margin-top: 22px; background: none; border: 0; padding: 0; color: var(--muted); font-size: 13px; font-weight: 700; letter-spacing: .04em; cursor: pointer; }
  .back-top:hover { color: var(--accent); }
  .credits { border: 1px solid var(--line); border-radius: 14px; padding: 24px 26px; background: rgba(255,255,255,.02); }
  .cr-h { font-family: var(--en); font-size: 11px; font-weight: 800; letter-spacing: .16em; color: var(--accent); text-transform: uppercase; }
  .cr-name { margin-top: 6px; font-size: 22px; font-weight: 800; color: var(--ink); }
  .cr-name span { margin-left: 10px; font-family: var(--en); font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: .04em; }
  .cr-list { list-style: none; margin: 8px 0 0; padding: 0; }
  .cr-list li { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 14px; padding: 9px 0; border-bottom: 1px solid var(--line); }
  .cr-list li:last-child { border-bottom: 0; }
  .cr-title { background: none; border: 0; padding: 0; cursor: pointer; text-align: left; color: var(--ink); font-weight: 700; font-size: 15px; }
  .cr-title:hover { color: var(--accent); }
  .cr-title .no { display: inline-block; min-width: 30px; font-family: var(--en); font-size: 12px; color: var(--accent); }
  .cr-title em { font-style: normal; margin-left: 8px; font-size: 12px; font-weight: 500; color: var(--muted); }
  .cr-links { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12.5px; }
  .cr-links a { color: var(--muted); font-weight: 600; }
  .cr-links a:hover { color: var(--accent); }
  .cr-mail { margin-top: 6px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
  .cr-mail a { font-family: var(--en); font-size: 22px; font-weight: 800; color: var(--ink); word-break: break-all; }
  .cr-mail a:hover { color: var(--accent); }
  .copy-mini { font-size: 12px; font-weight: 700; color: var(--muted); background: none; border: 1px solid var(--line); border-radius: var(--pill); padding: 4px 10px; cursor: pointer; }
  .copy-mini:hover { color: var(--ink); border-color: var(--line2); }
  /* 프로젝트 장에서만 보이는 프로젝트 탭 */
  .tabs { display: flex; justify-content: center; gap: 6px; margin-top: 8px; flex-wrap: wrap; transition: opacity .25s, transform .25s; }
  .tabs.hide { opacity: 0; transform: translateY(-6px); pointer-events: none; }
  .tab { font-size: 13px; font-weight: 700; padding: 6px 12px; border-radius: 3px; color: var(--ink); transition: background .2s; white-space: nowrap; }
  .tab:hover { background: rgb(255 255 255 / .06); }
  .tab.on { background: var(--accent); color: #fff; }
  .tab .no { font-family: var(--en); margin-right: 6px; opacity: .7; }
  @media (max-width: 1099px) { .top-links .gh { display: none; } .to-contact { padding: 7px 10px !important; } .top-row { grid-template-columns: auto 1fr auto; } .seg { justify-self: end; } .seg button { padding: 8px 11px; font-size: 13px; } }
  @media (max-width: 759px) { .top { padding: 10px 12px 8px; } .logo, .tabs { display: none; } .top-row { grid-template-columns: 1fr; } .seg { justify-self: center; }
    .seg button { padding: 8px 9px; font-size: 13px; } }
  .lbl-short, .lbl-m, .seg .m-only { display: none; }
  @media (max-width: 1099px) { .lbl-full { display: none; } .lbl-short { display: inline; } }
  @media (max-width: 759px) { .lbl-short { display: none; } .lbl-m { display: inline; } .seg .m-only { display: inline-block; } .top-links { display: none; } }
  @media (max-width: 759px) { .seg button { padding: 8px 6px; font-size: 12px; } }

  /* 이력 · 기술 */
  .block-h { display: flex; align-items: baseline; gap: 10px; padding-bottom: 10px; border-bottom: 1px solid var(--ink); margin-bottom: 4px; }
  .block-h b { font-family: var(--en); font-weight: 800; font-size: 15px; letter-spacing: .14em; color: var(--ink); }
  .block-h span { font-size: 12.5px; color: var(--muted); }
  .tl li { display: grid; grid-template-columns: 128px 1fr; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .tl time { font-family: var(--en); font-size: 12.5px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; line-height: 1.6; }
  .tl em { display: inline-block; margin-top: 4px; font-style: normal; font-family: 'Pretendard'; font-size: 11px; font-weight: 700; color: var(--accent); border: 1px solid var(--accent); border-radius: 3px; padding: 1px 6px; }
  .tl h3 { font-size: 14.5px; font-weight: 700; color: var(--ink); line-height: 1.45; }
  .tl h3 button:hover { color: var(--accent); }
  .tl p { font-size: 12.5px; color: var(--muted); margin-top: 2px; line-height: 1.5; }
  .tl-kind { font-family: var(--en); font-size: 11px; font-weight: 800; letter-spacing: .14em; color: var(--accent); margin: 14px 0 0; }
  .sk { text-align: left; padding: 12px 14px; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); transition: border-color .2s, background .2s; }
  .sk b { display: block; font-size: 14.5px; color: var(--ink); line-height: 1.35; }
  .sk span { display: block; margin-top: 4px; font-size: 11.5px; font-weight: 600; color: var(--muted); }
  .sk:hover { border-color: var(--line2); }
  .sk.on { border-color: var(--accent); background: rgb(236 28 35 / .08); box-shadow: inset 0 -2px 0 var(--accent); }
  .evi { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 4px 18px; }
  .evi li { display: grid; grid-template-columns: 150px 1fr; gap: 14px; padding: 11px 0; border-bottom: 1px solid var(--line); font-size: 14px; line-height: 1.6; }
  .evi li:last-child { border-bottom: 0; }
  .evi li button { text-align: left; font-weight: 700; color: var(--accent); font-size: 13px; line-height: 1.6; }
  .evi li button:hover { text-decoration: underline; text-underline-offset: 3px; }
  @media (max-width: 759px) { .tl li, .evi li { grid-template-columns: 1fr; gap: 2px; } }

  /* 자기소개서 */
  .quote { margin-top: 18px; padding: 16px 18px; background: var(--card); border-left: 3px solid var(--accent); border-radius: 0 var(--r) var(--r) 0; font-weight: 700; color: var(--ink); line-height: 1.55; font-size: 15px; }
  .quote small { display: block; margin-top: 8px; font-weight: 500; font-size: 12px; color: var(--muted); }
  .ch { display: grid; grid-template-columns: 30px 1fr; gap: 8px; width: 100%; text-align: left; padding: 9px 12px; border-radius: var(--r); transition: background .2s; }
  .ch i { font-style: normal; font-family: var(--en); font-weight: 800; font-size: 13px; color: var(--muted); line-height: 1.5; }
  .ch b { display: block; font-size: 14px; color: var(--body); line-height: 1.45; }
  .ch small { display: block; font-size: 12px; color: var(--muted); margin-top: 1px; }
  .ch:hover { background: rgb(255 255 255 / .04); }
  .ch.on { background: var(--ink); }
  .ch.on i { color: var(--accent); } .ch.on b { color: #111111; } .ch.on small { color: #55586A; }
  .page { position: relative; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; display: flex; flex-direction: column; min-height: 0; }
  .page-scroll { overflow-y: auto; overscroll-behavior: contain; padding: 32px 40px 36px; }
  .page .num { position: absolute; right: 26px; top: 14px; font-family: var(--en); font-weight: 800; font-size: 64px; line-height: 1; color: rgb(255 255 255 / .05); pointer-events: none; }
  .page p { font-size: 15px; line-height: 1.85; margin-top: 14px; }
  .page mark { background: linear-gradient(transparent 58%, rgb(236 28 35 / .38) 58%); color: var(--ink); font-weight: 700; padding: 0 1px; }
  .fade-in { animation: fadeIn .35s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .letter-grid { height: calc(100vh - 188px); min-height: 520px; }
  .page-scroll { flex: 1; min-height: 0; }
  @media (max-width: 1023px) { .letter-grid { height: auto; min-height: 0; } .page-scroll { overflow: visible; } }
  @media (max-width: 759px) { .page-scroll { padding: 22px 18px; } }

  /* 프로젝트 카드 */
  .pcard { display: flex; flex-direction: column; text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; transition: border-color .2s, transform .2s; }
  .pcard:hover { border-color: var(--accent); transform: translateY(-3px); }
  .pcard .thumb { position: relative; aspect-ratio: 16/10; background: #000; overflow: hidden; flex: none; }
  .pcard .thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .badge { position: absolute; top: 10px; font-size: 11.5px; font-weight: 700; padding: 3px 8px; border-radius: 3px; }
  .badge.no { left: 10px; background: var(--accent); color: #fff; font-family: var(--en); }
  .badge.team { right: 10px; background: rgb(17 17 17 / .82); color: var(--ink); }
  .chip.on-chip { border-color: var(--accent); color: var(--ink); background: rgb(236 28 35 / .12); }
  .gif-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin-right: 5px; vertical-align: middle; animation: gifPulse 1.4s ease-in-out infinite; }
  @keyframes gifPulse { 50% { opacity: .35; } }
  .clamp3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

  .progress { position: fixed; top: 0; left: 0; height: 3px; background: var(--accent); z-index: 30; transition: width .55s cubic-bezier(.7,0,.2,1); }
  .hint kbd { font-family: var(--en); font-size: 11px; border: 1px solid var(--line2); border-radius: 3px; padding: 1px 6px; color: var(--ink); }
  @media (max-width: 759px) { .bar { padding: 0 12px; gap: 8px; } .dots { display: none; } .hint { display: none; } }

  /* 표지 숫자 띠 — data에서 센 값만 */
  .stats { display: grid; grid-template-columns: repeat(4, auto); justify-content: start; gap: 10px 26px; margin-top: 18px; }
  @media (max-width: 1279px) { .stats { grid-template-columns: repeat(2, auto); } }   /* 좁으면 2칸 × 2줄로 고정(한 칸만 떨어지지 않게) */
  .leads { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .leads li { position: relative; padding-left: 16px; font-size: 15.5px; line-height: 1.55; }
  .leads li::before { content: ''; position: absolute; left: 0; top: .62em; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
  .leads b { color: var(--ink); font-weight: 700; }
  .lead-go { margin-left: 10px; font-size: 13px; font-weight: 700; color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; white-space: nowrap; }
  .lead-go:hover { text-decoration: underline; }

  .stat b { display: block; font-family: var(--en); font-weight: 800; font-size: 22px; line-height: 1.1; color: var(--ink); font-variant-numeric: tabular-nums; }
  .stat span { display: block; margin-top: 3px; font-size: 12px; color: var(--muted); }
  /* 기능 카드 · AI 표의 장면 바로가기 */
  .go { display: inline-flex; align-items: center; gap: 4px; min-height: 40px; padding: 0 14px; border: 1px solid var(--line2); border-radius: var(--pill); font-size: 13px; font-weight: 700; color: var(--accent); text-decoration: none; white-space: nowrap; transition: border-color .15s; }
  .go:hover { border-color: var(--accent); }
  /* AI와 일하는 방식 */
  .ai-lead { margin-top: 14px; font-size: 17px; font-weight: 700; color: var(--ink); line-height: 1.5; }
  .ai-card { padding: 18px 20px; }
  .ai-card h3 { font-size: 15px; font-weight: 800; color: var(--ink); }
  .ai-card p { margin-top: 8px; font-size: 13.5px; line-height: 1.7; }
  .src { display: block; margin-top: 6px; font-size: 12px; color: var(--muted); }
  .ai-rows { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 2px 18px; }
  .ai-rows li { display: grid; grid-template-columns: 160px 1fr 1fr 150px; gap: 16px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; line-height: 1.6; align-items: start; }
  .ai-rows li:last-child { border-bottom: 0; }
  .ai-rows .go { min-height: 34px; align-self: center; }
  .ai-rows li.head { font-size: 11.5px; font-weight: 800; letter-spacing: .06em; color: var(--muted); padding: 10px 0 8px; }
  .ai-rows li > button { text-align: left; font-weight: 700; color: var(--ink); }
  .ai-rows li > button:hover { color: var(--accent); }
  .ai-rows code, .ai-card code { font-size: .92em; color: var(--ink); }
  @media (max-width: 1023px) { .ai-rows li { grid-template-columns: 1fr; gap: 2px; } .ai-rows li.head { display: none; } }

  /* 다음 장 이름 버튼(11-26) — 처음 온 사람에게 다음 장이 있다는 것을 보여 줌 */
  .next-cta { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; max-width: 340px; padding: 0 14px; border: 1px solid var(--line2); border-radius: var(--pill); background: rgb(17 17 17 / .7); color: var(--ink); font-size: 13px; font-weight: 600; }
  .next-cta b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 800; }
  .next-cta span { color: var(--muted); flex: none; }
  .next-cta i { font-style: normal; color: var(--accent); flex: none; }
  .next-cta:hover { border-color: var(--accent); }
  .next-cta.first { background: var(--accent); border-color: var(--accent); color: #fff; } .next-cta.first span, .next-cta.first i { color: #fff; }
  @media (max-width: 759px) { .next-cta { max-width: 190px; margin-left: auto; } .next-cta span { display: none; } }
  /* 대표 그림 틀(11-26) — 그림 비율이 틀과 달라 생기는 빈 곳을 같은 그림의 흐린 배경으로 채움 */
  .frame { position: relative; overflow: hidden; border-radius: var(--r); border: 1px solid var(--line); background: #000; }
  .frame-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: blur(22px) brightness(.45); transform: scale(1.2); pointer-events: none; }
  .frame .shot { position: relative; display: block; border: 0; border-radius: 0; background: transparent; }
  /* 자기소개서 목차 — 좁은 폭에서는 가로 칩 한 줄(11-26) */
  .ch-list > li + li { margin-top: 4px; }
  .letter-grid > * { min-width: 0; }   /* 칩 줄이 칸 너비를 밀어 본문이 넘치지 않게 */
  @media (max-width: 1023px) {
    .letter-grid .quote { display: none; }
    .ch-list { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-top: 14px; scrollbar-width: thin; scrollbar-color: var(--line2) transparent; }
    .ch-list > li { flex: none; } .ch-list > li + li { margin-top: 0; }
    .ch-list .ch { width: auto; grid-template-columns: auto auto; gap: 6px; padding: 8px 12px; border: 1px solid var(--line); }
    .ch-list .ch b { white-space: nowrap; font-size: 13px; } .ch-list .ch small { display: none; }
  }

  .shot { width: 100%; border-radius: var(--r); border: 1px solid var(--line); background: #000; object-fit: cover; }
  .feat-no { font-family: var(--en); font-weight: 800; font-size: 13px; color: var(--accent); letter-spacing: .08em; }
  @media (prefers-reduced-motion: reduce) { .rail, .progress { transition: none; } }
</style>

<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useCallback, useRef } = React;
const T = (k, v) => PFStr.t(k, v);
try { history.scrollRestoration = 'manual'; } catch { /* 그대로 */ }
const img = (id, src) => `../src/${id}/${src}`;

/* ───── 슬라이드 조각 ───── */
function Wrap({ children }) { return <div className="slide-inner"><div className="wrap">{children}</div></div>; }

// 표지 + 자기소개 한 장: 왼쪽은 타이틀 그림, 오른쪽 어두운 판에 이름·한 줄 소개·자기소개·연락처
function CoverSlide({ profile, coverImg, stats, reel, goProject }) {
  const paras = String(profile.intro || '').split('\n').filter(Boolean);
  // 자기소개 단락마다 굵은 첫 문장만(profile.md 원문 그대로) — 긴 이야기는 프로젝트 · AI · 자기소개서 장에서 읽음(11-26 A안)
  const leads = paras.map((p) => { const m = p.match(/^(.+?다\.)(\s|$)/); return m ? m[1] : p; });
  const LEAD_GO = [null, { to: '#projects', label: '프로젝트에서 보기' }, { to: '#ai', label: 'AI와 일하는 방식' }];
  return (
    <section className="slide hero" aria-label={T('page.intro')}>
      {coverImg && <div className="hero-art"><img className="hero-img" src={coverImg} alt="" /></div>}
      <div className="hero-shade" />
      <div className="hero-panel">
        <div className="hero-copy">
          <div className="eyebrow">{T('en.portfolio')}</div>
          <h1 className="h-big text-5xl xl:text-6xl mt-4">{profile.name}</h1>
          {profile.nameEn && <div className="mt-2 text-lg font-bold accent" style={{ fontFamily: 'var(--en)', letterSpacing: '.04em' }}>{profile.nameEn}</div>}
          {profile.headline && <p className="mt-6 text-xl xl:text-2xl font-bold leading-snug" style={{ color: 'var(--ink)' }}>{profile.headline}</p>}
          {stats && stats.length > 0 && (
            <div className="stats" aria-label="숫자로 보기">
              {stats.map((s) => <div key={s.label} className="stat"><b>{s.value}</b><span>{s.label}</span></div>)}
            </div>
          )}
          {leads.length > 0 && (
            <div className="mt-7 pt-6" style={{ borderTop: '1px solid var(--line)' }}>
              <div className="eyebrow mb-3">{T('en.about')}</div>
              <ul className="leads">
                {leads.map((t, i) => (
                  <li key={i}><b>{t}</b>{LEAD_GO[i] && <button type="button" className="lead-go" onClick={() => goProject(LEAD_GO[i].to)}>{LEAD_GO[i].label} →</button>}</li>
                ))}
              </ul>
            </div>
          )}
          <div className="mt-7 flex flex-wrap gap-3">
            <button type="button" className="btn btn-fill" onClick={() => goProject('#projects')}>프로젝트 보기 →</button>
            {reel && <a className="btn btn-line" href={reel.links.video} target="_blank" rel="noopener">▶ 대표작 시연 영상 ↗</a>}
            <button type="button" className="btn btn-ghost" onClick={() => goProject('#contact')}>✉ {T('page.nav-contact')} →</button>
          </div>
        </div>
      </div>
    </section>
  );
}

// 이력 · 기술 한 장: 왼쪽 연표(교육 + 프로젝트 기간), 오른쪽 기술 칸 → 누르면 "프로젝트 | 근거" 줄
function HistorySkillsSlide({ history, skills, titleOf, goProject }) {
  const [sel, setSel] = useState(0);
  const s = skills[sel] || { evidence: [] };
  const projCount = (x) => new Set((x.evidence || []).map((e) => e.project).filter(Boolean)).size;
  return (
    <section className="slide" aria-label={`이력 · ${T('page.stack')}`}>
      <Wrap>
        <div className="grid lg:grid-cols-12 gap-10 lg:gap-14 items-start">
          <div className="lg:col-span-5">
            <div className="block-h"><b>HISTORY</b><span>교육 · 프로젝트 · 게임 분석</span></div>
            <ul className="tl">
              {history.map((h, i) => (
                <React.Fragment key={i}>
                  {h.kindStart && <li style={{ display: 'block', border: 0, padding: 0 }}><div className="tl-kind">{h.kindStart}</div></li>}
                  <li>
                    <time>{h.when}{h.badge && <><br /><em>{h.badge}</em></>}</time>
                    <div>
                      <h3>{h.project ? <button className="text-left" onClick={() => goProject(h.project)}>{h.title}</button> : h.title}</h3>
                      {h.sub && <p>{h.sub}</p>}
                    </div>
                  </li>
                </React.Fragment>
              ))}
            </ul>
          </div>
          <div className="lg:col-span-7">
            <div className="block-h"><b>{T('en.skills')}</b><span>{T('page.stack')} · {T('page.stack-note')}</span></div>
            <div className="grid grid-cols-2 sm:grid-cols-4 gap-2.5 mt-4">
              {skills.map((x, i) => (
                <button key={x.name} className={`sk ${i === sel ? 'on' : ''}`} onClick={() => setSel(i)} aria-pressed={i === sel}>
                  <b>{x.name}</b><span>근거 {(x.evidence || []).length}건 · 프로젝트 {projCount(x)}개</span>
                </button>
              ))}
            </div>
            <ul key={sel} className="evi mt-4 fade-in" aria-live="polite">
              {(s.evidence || []).map((e, i) => (
                <li key={i}>
                  {e.project ? <button onClick={() => goProject(e.project)}>{titleOf(e.project)}</button> : <span />}
                  <span>{e.text.replace(/`/g, '')}</span>
                </li>
              ))}
            </ul>
          </div>
        </div>
      </Wrap>
    </section>
  );
}

// 자기소개서 한 장: ../자기소개서.md를 그대로 읽어 "## 번호. 제목 — 부제"마다 장으로 나눔. **굵은 글씨**는 형광펜
function inlineMd(t) {
  return t.split(/(\*\*[^*]+\*\*)/g).map((x, i) => (/^\*\*[^*]+\*\*$/.test(x) ? <mark key={i}>{x.slice(2, -2)}</mark> : x));
}
function LetterSlide({ letter, quote, name }) {
  const [sel, setSel] = useState(0);
  const scroller = useRef(null);
  const article = useRef(null);
  useEffect(() => { if (scroller.current) scroller.current.scrollTop = 0; }, [sel]);
  const c = letter.chapters[sel] || letter.chapters[0];
  return (
    <section className="slide" aria-label={T('name.letter')}>
      <div className="slide-inner">
        <div className="wrap" style={{ width: '100%', justifyContent: 'stretch' }}>
          <div className="letter-grid grid lg:grid-cols-12 gap-8 lg:gap-10">
            <aside className="lg:col-span-4 flex flex-col">
              <div className="eyebrow">COVER LETTER</div>
              <h2 className="h-big text-3xl md:text-4xl mt-3">{T('name.letter')}<span className="accent">.</span></h2>
              {quote && <blockquote className="quote">“{quote}”<small>— {name}</small></blockquote>}
              <ul className="ch-list mt-5">
                {letter.chapters.map((x, i) => (
                  <li key={i}>
                    <button className={`ch ${i === sel ? 'on' : ''}`} aria-pressed={i === sel}
                      onClick={() => { setSel(i); if (window.innerWidth < 1024) setTimeout(() => {
                        // 장 안의 세로 스크롤만 움직임(scrollIntoView는 가로 레일까지 밀어 버림)
                        const a = article.current, box = a && a.closest('.slide-inner'); if (!box) return;
                        box.scrollTo({ top: box.scrollTop + a.getBoundingClientRect().top - box.getBoundingClientRect().top - 64, behavior: 'smooth' });
                      }, 50); }}>
                      <i>{String(x.no).padStart(2, '0')}</i>
                      <span><b>{x.title}</b>{x.sub && <small>{x.sub}</small>}</span>
                    </button>
                  </li>
                ))}
              </ul>
              <a className="btn btn-line mt-5 self-start" href="../letter.html">{T('page.letter-go')} →</a>
            </aside>
            <article className="page lg:col-span-8" ref={article} style={{ scrollMarginTop: 64 }}>
              <span className="num">{String(c.no).padStart(2, '0')}</span>
              <div className="page-scroll" ref={scroller}>
                <div key={sel} className="fade-in">
                  <div className="text-[13px] font-bold accent"><span style={{ fontFamily: 'var(--en)', letterSpacing: '.1em' }}>{String(c.no).padStart(2, '0')}</span>{c.sub ? ` · ${c.sub}` : ''}</div>
                  <h3 className="mt-2 text-2xl font-extrabold leading-snug" style={{ color: 'var(--ink)' }}>{c.title}</h3>
                  {c.paras.map((p, i) => <p key={i}>{inlineMd(p)}</p>)}
                </div>
              </div>
            </article>
          </div>
        </div>
      </div>
    </section>
  );
}
// 기술 문서 md에서 절마다 그림 찾기 — 기능 카드는 "그 기능 절(section)의 그림"(GIF 먼저), 남은 GIF는 프로젝트 장의 화면 모음으로
function docImages(md) {
  const lines = md.replace(/<!--[\s\S]*?-->/g, '').split('\n');
  const heads = [], imgs = [];
  let fence = false;
  lines.forEach((l, n) => {
    if (/^\s*```/.test(l)) { fence = !fence; return; }
    if (fence) return;
    const h = l.match(/^(#{1,6})\s+(.+?)\s*$/);
    if (h) { heads.push({ n, level: h[1].length, text: h[2].replace(/`/g, '').trim() }); return; }
    const re = /!\[([^\]]*)\]\((<[^>]+>|[^)\s]+)\)/g; let m;
    while ((m = re.exec(l))) {
      let src = m[2].replace(/^<|>$/g, '');
      try { src = decodeURI(src); } catch { /* 그대로 */ }
      if (/^https?:/i.test(src)) continue;
      imgs.push({ n, src: src.replace(/^\.\//, ''), alt: m[1].trim() });
    }
  });
  return { heads, imgs };
}
function sectionImages(d, section) {
  const want = String(section || '').replace(/`/g, '').trim();
  if (!want) return [];
  const i = d.heads.findIndex((h) => h.text === want || h.text.startsWith(want) || want.startsWith(h.text));
  if (i < 0) return [];
  const h = d.heads[i];
  const end = (d.heads.slice(i + 1).find((x) => x.level <= h.level) || { n: Infinity }).n;
  return d.imgs.filter((x) => x.n > h.n && x.n < end);
}
const isGif = (s) => /\.gif$/i.test(s);
const capText = (c) => (c && typeof c === 'object' ? c.text || '' : c || '');   // caption이 { text, verbatim }일 때도
const shortCap = (alt) => String(capText(alt)).split(/\s+—\s+/)[0];
function buildMedia(p, md) {
  const d = docImages(md);
  const features = (p.highlights || []).map((h) => {
    const inSec = sectionImages(d, h.section);
    const gifs = inSec.filter((x) => isGif(x.src));
    if (gifs.length) return gifs;                                   // 그 절에 GIF가 있으면 GIF(여러 개면 모두)
    if (h.image && h.image.src) return [{ src: h.image.src, alt: h.image.caption || h.title, w: h.image.w, h: h.image.h }];
    return inSec.slice(0, 1);
  });
  const used = new Set(features.flat().map((x) => x.src));
  const extra = d.imgs.filter((x) => isGif(x.src) && !used.has(x.src)).filter((x, i, a) => a.findIndex((y) => y.src === x.src) === i);
  return { features, extra };
}

// 그림 여러 장을 한 자리에서 바꿔 보기(아래 칩으로 고름)
function MediaSwitch({ id, items, className = '', style, pixel }) {
  const [k, setK] = useState(0);
  const cur = items[k] || items[0];
  if (!cur) return null;
  return (
    <figure className={className} style={style}>
      <div className="frame">
        <img className="frame-bg" src={img(id, cur.src)} alt="" aria-hidden="true" loading="lazy" />
        <img key={cur.src} className="shot fade-in" src={img(id, cur.src)} alt={capText(cur.alt)} loading="lazy"
          style={{ aspectRatio: cur.w && cur.h ? `${cur.w}/${cur.h}` : '16/9', objectFit: 'contain', imageRendering: pixel ? 'pixelated' : 'auto' }} />
      </div>
      {items.length > 1 ? (
        <div className="mt-2 flex flex-wrap gap-1.5">
          {items.map((x, i) => (
            <button key={x.src} onClick={() => setK(i)} className={`chip ${i === k ? 'on-chip' : ''}`} style={{ fontSize: 11.5, padding: '2px 8px' }}>
              {isGif(x.src) && <span className="gif-dot" />}{x.label || shortCap(x.alt) || `${i + 1}`}
            </button>
          ))}
        </div>
      ) : (cur.alt && !cur.label && <figcaption className="mt-1.5 text-xs muted leading-snug">{isGif(cur.src) && <span className="gif-dot" />}{shortCap(cur.alt)}</figcaption>)}
    </figure>
  );
}

function parseLetter(md) {
  const text = md.replace(/<!--[\s\S]*?-->/g, '');
  const parts = text.split(/^##\s+/m);
  const head = parts.shift() || '';
  const chapters = parts.map((sec) => {
    const [first, ...rest] = sec.split('\n');
    const m = first.trim().match(/^(\d+)\.\s*(.+)$/);
    const full = m ? m[2] : first.trim();
    const [title, sub] = full.split(/\s+—\s+/);
    const paras = rest.join('\n').split(/\n\s*\n/).map((p) => p.split('\n').map((l) => l.trim()).filter(Boolean).join(' ')).filter(Boolean);
    return { no: m ? +m[1] : 0, title: title.trim(), sub: (sub || '').trim(), paras };
  }).filter((c) => c.paras.length);
  // 머리줄의 교육 과정: "… · 기관 「과정 이름」 시작 ~ 끝(수료 예정)"
  let course = null;
  const cm = head.match(/·\s*([^·「\n]+?)\s*「([^」]+)」\s*(\d{4}-\d{2}-\d{2})\s*~\s*(\d{4}-\d{2}-\d{2})\s*(?:\(([^)]+)\))?/);
  if (cm) course = { org: cm[1].trim(), name: cm[2].trim(), start: cm[3], end: cm[4], note: (cm[5] || '').trim() };
  return { chapters, course };
}

function teamLabel(p) {

  if (t.type === 'team') return T('name.team') + (t.size ? ` · ${t.size}` : '');

// 직접 만든 원본 발표 자료가 있으면 「슬라이드」는 그 파일을 엶 (강사님 피드백 11-21: "슬라이드는 니꺼 원본 써")
const ORIGINAL_DECK = {
  '5-wow-hardcore-analysis': 'Present File/WoW_클래식_하드코어_전투시스템_분석_문서순서.pptx.pdf', // 11-25 문서 순서판(37장)
};
const deckHref = (p) => ORIGINAL_DECK[p.id]
  ? `../src/${encodeURIComponent(p.id)}/${ORIGINAL_DECK[p.id].split('/').map(encodeURIComponent).join('/')}`
  : `../project.html?p=${encodeURIComponent(p.id)}`;
// 장면 바로가기(슬라이드의 장면 id는 d-<data 장면 key>) — 원문 절 제목으로 data의 슬라이드 장면을 페이지가 열릴 때 찾음(다시 빌드해 장면 id가 바뀌어도 따라감).
// 원본 PDF를 쓰는 프로젝트는 상세 문서의 그 절로. 못 찾으면 null(링크를 숨김)
const secKey = (s) => String(s || '').replace(/`/g, '').split(/\s+—\s+/)[0].trim();
function sceneHref(p, section) {
  const want = secKey(section);
  if (!want) return null;
  if (ORIGINAL_DECK[p.id]) return `../doc.html?p=${encodeURIComponent(p.id)}#sec=${encodeURIComponent(String(section).replace(/`/g, '').trim())}`;
  const sl = ((p.deck || {}).slides || []).find((s) => (s.sectionPath || []).some((x) => secKey(x).startsWith(want)));
  return sl ? `../project.html?p=${encodeURIComponent(p.id)}#s=d-${encodeURIComponent(sl.key)}` : null;
}
// 덱의 「AI 협업」(또는 「AI 활용」) 장 — 그 장의 원문 절로 장면을 찾음
function aiSceneHref(p) {
  const ch = ((p.deck || {}).chapters || []).find((c) => /^AI\s*(협업|활용)/.test(c.title || ''));
  if (!ch) return null;
  if (ORIGINAL_DECK[p.id]) return sceneHref(p, (ch.sectionPath || [])[0]);
  const sl = ((p.deck || {}).slides || []).find((s) => s.chapter === ch.key);   // 그 장의 첫 장면
  return sl ? `../project.html?p=${encodeURIComponent(p.id)}#s=d-${encodeURIComponent(sl.key)}` : null;
}

// 「AI와 일하는 방식」 — ../AI와 일하는 방식.md(수강생 파일)를 읽어 그림. 「> 」 머리 문장 · 「## 」 카드 · 표(첫 칸 = src 폴더 이름)
function parseAiWay(md) {
  const text = md.replace(/<!--[\s\S]*?-->/g, '');
  const lead = ((text.match(/^>\s*(.+)$/m) || [])[1] || '').trim();
  const cards = text.split(/^##\s+/m).slice(1).map((sec) => {
    const [first, ...rest] = sec.split('\n');
    const body = rest.filter((l) => !/^\s*\|/.test(l)).map((l) => l.trim()).filter(Boolean).join(' ');
    const m = body.match(/^(.*?)\s*\(([^()]+)\)\s*$/);
    return { title: first.trim(), text: m ? m[1] : body, src: m ? m[2] : '' };
  }).filter((c) => c.text);
  const rows = text.split('\n').filter((l) => /^\s*\|/.test(l)).map((l) => l.trim().replace(/^\||\|$/g, '').split('|').map((x) => x.trim()))
    .filter((c) => c.length >= 3 && !/^-+$/.test(c[0]) && c[0] !== '프로젝트');
  return { lead, cards, rows };
}
const codeMd = (t) => String(t).split(/(`[^`]+`)/g).map((x, i) => (/^`[^`]+`$/.test(x) ? <code key={i}>{x.slice(1, -1)}</code> : x));
function splitSrc(t) { const m = String(t).match(/^(.*?)\s*\(([^()]+)\)\s*$/); return m ? [m[1], m[2]] : [t, '']; }
function AiWaySlide({ ai, projects, goProject }) {

function CopyMail({ email, big }) {
  const [done, setDone] = useState(false);
  const copy = async () => {
    try { await navigator.clipboard.writeText(email); }
    catch (e) { const t = document.createElement('textarea'); t.value = email; document.body.appendChild(t); t.select(); try { document.execCommand('copy'); } catch (_) {} t.remove(); }
    setDone(true); setTimeout(() => setDone(false), 1800);
  };
  return <button type="button" className={big ? 'btn btn-line' : 'copy-mini'} onClick={copy} aria-live="polite">{done ? '✓ 복사했습니다' : (big ? '⧉ 주소 복사' : '⧉ 복사')}</button>;
}

        // 자기소개서.md(수강생 파일)가 있으면 자기소개서 장 — 없거나 못 읽으면 그 장을 빼고 그림
        let letter = null;
        try { const r = await fetch('../' + encodeURIComponent('자기소개서.md'), { cache: 'no-cache' }); if (r.ok) { const l = parseLetter(await r.text()); if (l.chapters.length) letter = l; } } catch { /* 빼고 그림 */ }
        // AI와 일하는 방식.md(수강생 파일)가 있으면 그 장 — 없거나 못 읽으면 빼고 그림
        let ai = null;
        try { const r = await fetch('../' + encodeURIComponent('AI와 일하는 방식.md'), { cache: 'no-cache' }); if (r.ok) { const a = parseAiWay(await r.text()); if (a.cards.length || a.rows.length) ai = a; } } catch { /* 빼고 그림 */ }
        document.title = `${pf.profile.name} · ${T('name.portfolio')}`;
        setState({ pf, projects, letter, ai });
      } catch (e) { setErr(String(e && e.message || e)); }
    })();
  }, []);

  // 슬라이드 목록 만들기
  const slides = [];
  if (state) {
    const { pf } = state;
    const projects = state.projects.filter((p) => !isAnalysis(p));    // 만든 게임
    const analyses = state.projects.filter(isAnalysis);               // 게임 분석 — 따로 탭
    const wyb = projects.find((p) => p.id === '1-watch-your-back');
    const titleShot = wyb && (wyb.screenshots || []).find((s) => /GameMenu/i.test(s.src));
    // 타이틀 화면(GameMenu.png): 11-23 문서 정리로 본문에서 빠져 data 스크린샷 목록에 없으므로, src의 그림 파일을 직접 씀
    const coverImg = titleShot ? img(wyb.id, titleShot.src) : (wyb ? img(wyb.id, 'images/GameMenu.png') : '');
    const titleOf = (id) => (state.projects.find((p) => p.id === id) || {}).title || id;
    // 표지 숫자 띠 — data에서 세기만 함(새 글 없음)
    const stats = [];
    if (projects.length) {
      const solo = projects.filter((p) => (p.team || {}).type === 'solo').length, team = projects.filter((p) => (p.team || {}).type === 'team').length;
      stats.push({ value: projects.length, label: `만든 게임${solo || team ? ` (개인 ${solo} · 팀 ${team})` : ''}` });
      const ds = projects.flatMap((p) => { const m = (p.meta || []).find((x) => /기간/.test(x.label)); return m ? (m.value.match(/\d{4}-\d{2}-\d{2}/g) || []) : []; }).sort();
      if (ds.length) { const a = ds[0], b = ds[ds.length - 1], ym = (d) => d.slice(0, 7).replace('-', '.');
        stats.push({ value: a.slice(0, 4) === b.slice(0, 4) ? `${ym(a)} – ${b.slice(5, 7)}` : `${ym(a)} – ${ym(b)}`, label: '제작 기간' }); }
      const vids = projects.filter((p) => (p.links || {}).video).length;
      if (vids) stats.push({ value: vids, label: '시연 영상' });
    }
    if (analyses.length) stats.push({ value: analyses.length, label: '게임 분석 문서' });
    // 연표: 교육(자기소개서 머리줄) + 프로젝트 기간(새 것부터)
    const history = [];
    const L = state.letter;
    if (L && L.course) {
      const c = L.course, fmt = (d) => d.slice(0, 7).replace('-', '.');
      history.push({ kindStart: '교육', when: `${fmt(c.start)} – ${fmt(c.end)}`, badge: c.note, title: c.name, sub: c.org });
    }
    projects.map((p) => ({ p, per: periodOf(p) })).filter((x) => x.per).sort((a, b) => b.per.start.localeCompare(a.per.start))
      .forEach((x, i) => history.push({ kindStart: i === 0 ? '프로젝트' : '', when: x.per.text, title: x.p.title, sub: teamLabel(x.p), project: x.p.id }));
    analyses.map((p) => ({ p, per: periodOf(p) })).filter((x) => x.per).sort((a, b) => b.per.start.localeCompare(a.per.start))
      .forEach((x, i) => history.push({ kindStart: i === 0 ? '게임 분석' : '', when: x.per.text, title: x.p.title, sub: '개인 분석', project: x.p.id }));
    // 장 순서(11-26 건우 님 A안 · 증거 먼저): 소개 → 프로젝트 → AI와 일하는 방식 → 게임 분석 → 이력 · 기술 → 자기소개서
    const reel = projects.find((p) => (p.links || {}).video);   // 표지 「대표작 시연 영상」 = 영상이 있는 첫 프로젝트
    slides.push({ key: 'cover', group: 'intro', label: T('page.intro'), el: (goProject) => <CoverSlide profile={pf.profile} coverImg={coverImg} stats={stats} reel={reel} goProject={goProject} /> });
    slides.push({ key: 'projects', group: 'projects', label: T('page.nav-projects'), el: (goProject) => <ProjectsGridSlide projects={projects} goProject={goProject} /> });
    projects.forEach((p, i) => {
      slides.push({ key: `p-${p.id}`, group: 'projects', project: p.id, label: p.title, el: () => <ProjectSlide p={p} no={i + 1} total={projects.length} /> });
      if ((p.highlights || []).length) slides.push({ key: `p-${p.id}-core`, group: 'projects', of: p.id, label: `${p.title} · ${T('page.features')}`, el: () => <FeaturesSlide p={p} no={i + 1} /> });
    });
    if (state.ai) slides.push({ key: 'ai', group: 'ai', label: 'AI와 일하는 방식', el: (goProject) => <AiWaySlide ai={state.ai} projects={state.projects} goProject={goProject} /> });
    analyses.forEach((p, i) => {
      slides.push({ key: `p-${p.id}`, group: 'analysis', project: p.id, label: p.title, el: () => <ProjectSlide p={p} no={i + 1} total={analyses.length} /> });
      if ((p.highlights || []).length) slides.push({ key: `p-${p.id}-core`, group: 'analysis', of: p.id, label: `${p.title} · 핵심 분석`, el: () => <FeaturesSlide p={p} no={i + 1} /> });
    });
    slides.push({ key: 'history', group: 'stack', label: `이력 · ${T('page.stack')}`, el: (goProject) => <HistorySkillsSlide history={history} skills={pf.skills || []} titleOf={titleOf} goProject={goProject} /> });
    if (L) slides.push({ key: 'letter', group: 'letter', label: T('name.letter'), el: () => <LetterSlide letter={L} quote={pf.profile.headline} name={pf.profile.name} /> });
    slides.push({ key: 'contact', group: 'contact', label: T('page.nav-contact'), el: (goProject) => <ContactSlide profile={pf.profile} projects={[...projects, ...analyses]} goProject={goProject} endImg={wyb ? img(wyb.id, 'images/GameClear.png') : ''} /> });
  }
  const n = slides.length;

  // 위 칸 버튼의 주제 — 누르면 그 주제의 첫 장으로
  const TOPICS = [
    { group: 'intro', label: T('page.nav-intro') },
    { group: 'projects', label: T('page.nav-projects') },
    { group: 'ai', label: 'AI와 일하는 방식', short: 'AI 방식' },
    { group: 'analysis', label: '게임 분석', mshort: '분석' },
    { group: 'stack', label: '이력 · 기술', mshort: '이력' },
    { group: 'letter', label: T('page.nav-letter') },
    { group: 'contact', label: T('page.nav-contact'), mobile: true },   // 폰 폭에서만: 위 띠 오른쪽 연락처 버튼 대신 메뉴 끝 칸
  ].filter((t) => slides.some((s) => s.group === t.group));
  const cur = slides[idx] || {};
  const curProject = cur.project || cur.of || null;
  const firstOf = (g) => slides.findIndex((s) => s.group === g);

  // 칸 버튼의 손잡이를 지금 주제 칸으로 옮김
  const segRef = useRef(null);
  const [thumb, setThumb] = useState({ x: 0, w: 0, on: false });
  useEffect(() => {
    const place = () => {
      const seg = segRef.current; if (!seg) return;
      const b = seg.querySelector('button.on');
      if (!b) { setThumb((t) => ({ ...t, on: false })); return; }
      setThumb({ x: b.offsetLeft, w: b.offsetWidth, on: true });
    };
    place();
    window.addEventListener('resize', place);
    return () => window.removeEventListener('resize', place);
  }, [idx, n]);

  const go = useCallback((i) => setIdx((cur) => Math.max(0, Math.min(n - 1, typeof i === 'function' ? i(cur) : i))), [n]);
  const goProject = useCallback((id) => { const i = String(id).startsWith('#') ? slides.findIndex((s) => s.key === id.slice(1)) : slides.findIndex((s) => s.project === id); if (i >= 0) go(i); }, [n]);

  // 주소(#key)와 맞추기 — 새로고침·공유해도 같은 장
  useEffect(() => {
    if (!n) return;
    const fromHash = () => { const k = decodeURIComponent(location.hash.slice(1)); const i = slides.findIndex((s) => s.key === k); if (i >= 0) setIdx(i); };
    fromHash();
    window.addEventListener('hashchange', fromHash);
    return () => window.removeEventListener('hashchange', fromHash);
  }, [n]);
  useEffect(() => { if (n && slides[idx]) history.replaceState(null, '', '#' + slides[idx].key); }, [idx, n]);

  // 키보드: ← → (+ PageUp/PageDown · Home/End · Space)
  useEffect(() => {
    const onKey = (e) => {
      if (e.altKey || e.ctrlKey || e.metaKey) return;
      if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
      const k = e.key;
      if (k === 'ArrowRight' || k === 'PageDown' || (k === ' ' && !e.shiftKey)) { e.preventDefault(); go((c) => c + 1); }
      else if (k === 'ArrowLeft' || k === 'PageUp' || (k === ' ' && e.shiftKey)) { e.preventDefault(); go((c) => c - 1); }
      else if (k === 'Home') { e.preventDefault(); go(0); }
      else if (k === 'End') { e.preventDefault(); go(n - 1); }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [go, n]);

  // 새 장으로 오면 그 장의 안쪽 스크롤을 맨 위로, 화면 밖 장은 Tab으로 못 들어가게
  useEffect(() => {
    // 페이지 자체는 가로로 밀리지 않게(장 이동은 레일의 transform만으로)
    document.documentElement.scrollLeft = 0; document.body.scrollLeft = 0;
    document.querySelectorAll('.slide').forEach((s, i) => {
      s.inert = i !== idx;
      if (i === idx) { const inner = s.querySelector('.slide-inner'); if (inner) inner.scrollTop = 0; }
    });
  }, [idx, n]);

  // 휴대폰: 좌우로 밀어 넘기기
  const onTouchStart = (e) => { const t = e.touches[0]; touch.current = { x: t.clientX, y: t.clientY }; };
  const onTouchEnd = (e) => {
    if (!touch.current) return;
    const t = e.changedTouches[0], dx = t.clientX - touch.current.x, dy = t.clientY - touch.current.y;
    touch.current = null;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) go((c) => c + (dx < 0 ? 1 : -1));
  };

  if (err) return <div className="p-10" style={{ color: 'var(--ink)' }}>데이터를 읽지 못했습니다: {err}<br /><span className="muted text-sm">로컬 서버(python -m http.server 4600)로 열었는지, /portfolio-build를 했는지 확인해 주세요.</span></div>;
  if (!state) return <div className="h-full grid place-items-center muted">…</div>;

  return (
    <>
      <div className="progress" style={{ width: `${((idx + 1) / n) * 100}%` }} />
      <header className="top">
        <div className="top-row">
          <button className="logo" onClick={() => go(0)}>{state.pf.profile.nameEn || state.pf.profile.name}<i>.</i></button>
          <nav className="seg" ref={segRef} aria-label="주제 바로 가기">
            <span className="seg-thumb" style={{ width: thumb.w, transform: `translateX(${thumb.x}px)`, opacity: thumb.on ? 1 : 0 }} />
            {TOPICS.map((t) => (
              <button key={t.group} className={`${cur.group === t.group ? 'on' : ''} ${t.mobile ? 'm-only' : ''}`} onClick={() => go(firstOf(t.group))} aria-current={cur.group === t.group ? 'true' : undefined}><span className="lbl-full">{t.label}</span><span className="lbl-short">{t.short || t.label}</span><span className="lbl-m">{t.mshort || t.short || t.label}</span></button>
            ))}
          </nav>
          <div className="top-links">
            {state.pf.profile.github && <a className="gh" href={state.pf.profile.github} target="_blank" rel="noopener">GitHub ↗</a>}
            <button type="button" className={`to-contact ${cur.group === 'contact' ? 'on' : ''}`} onClick={() => go(firstOf('contact'))}>✉ {T('page.nav-contact')}</button>
          </div>
        </div>
        <div className={`tabs ${cur.group === 'projects' ? '' : 'hide'}`} aria-label={T('page.nav-projects')}>
          {state.projects.filter((p) => !isAnalysis(p)).map((p, i) => (
            <button key={p.id} className={`tab ${curProject === p.id ? 'on' : ''}`} onClick={() => goProject(p.id)} tabIndex={cur.group === 'projects' ? 0 : -1}>
              <span className="no">{String(i + 1).padStart(2, '0')}</span>{p.title.replace(/\s*\(.*\)$/, '').replace(/\s+—.*$/, '')}
            </button>
          ))}
        </div>
      </header>
      <main className="h-full" onTouchStart={onTouchStart} onTouchEnd={onTouchEnd}>
        <div className="rail" style={{ transform: `translateX(-${idx * 100}vw)` }}>
          {slides.map((s) => <React.Fragment key={s.key}>{s.el(goProject)}</React.Fragment>)}
        </div>
      </main>
      <nav className="bar" aria-label="슬라이드 이동">
        <button className="navbtn" onClick={() => go((c) => c - 1)} disabled={idx === 0} aria-label="이전">←</button>
        <button className="navbtn" onClick={() => go((c) => c + 1)} disabled={idx === n - 1} aria-label="다음">→</button>
        <span className="hint text-xs muted ml-2"><kbd>←</kbd> <kbd>→</kbd> 키로 넘기기</span>
        <div className="dots">{slides.map((s, i) => <button key={s.key} className={`dot ${i === idx ? 'on' : ''}`} onClick={() => go(i)} aria-label={s.label} title={s.label} />)}</div>
        {slides[idx + 1] && <button className={`next-cta ${idx === 0 ? 'first' : ''}`} onClick={() => go((c) => c + 1)} aria-label={`다음: ${slides[idx + 1].label}`}><span>다음</span><b>{slides[idx + 1].label}</b><i>→</i></button>}
        <span className="counter">{String(idx + 1).padStart(2, '0')} / {String(n).padStart(2, '0')}</span>
      </nav>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
